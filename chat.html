<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SchoolChat</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- PeerJS for WebRTC calls -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Emoji Button -->
    <script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.3/dist/index.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #313338;
            color: white;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 260px;
            background-color: #2B2D31;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #232428;
            z-index: 20;
        }

        .sidebar-header {
            padding: 15px;
            background-color: #202225;
            border-bottom: 1px solid #232428;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 18px;
            font-weight: bold;
        }

        .user-profile {
            padding: 15px;
            background-color: #2B2D31;
            border-bottom: 1px solid #232428;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
            background-color: #5865F2;
        }

        .user-info {
            flex-grow: 1;
        }

        .username-display {
            font-weight: bold;
            font-size: 14px;
        }

        .friend-list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .friend-item:hover {
            background-color: #35373C;
        }

        .friend-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 10px;
            background-color: #5865F2;
        }

        .friend-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #747F8D;
            margin-left: auto;
        }

        .online {
            background-color: #3BA55C;
        }

        .add-friend-section {
            padding: 15px;
            border-top: 1px solid #232428;
        }

        .add-friend-input {
            width: 100%;
            padding: 8px;
            background-color: #40444B;
            border: none;
            border-radius: 4px;
            color: white;
            margin-bottom: 10px;
        }

        .add-friend-btn {
            width: 100%;
            padding: 8px;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .logout-btn {
            margin-top: 10px;
            padding: 8px;
            background-color: #ED4245;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Chat Area */
        #chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 15px;
            background-color: #202225;
            border-bottom: 1px solid #232428;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .call-btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .messages-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 8px;
            word-wrap: break-word;
            background-color: rgba(64, 68, 75, 0.9);
            backdrop-filter: blur(5px);
        }

        .message.self {
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.other {
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-author {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }

        .input-area {
            padding: 15px;
            background-color: #2B2D31;
            border-top: 1px solid #232428;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .msg-input {
            flex-grow: 1;
            padding: 12px;
            background-color: #40444B;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .attach-btn, .emoji-btn {
            background: none;
            border: none;
            color: #B9BBBE;
            cursor: pointer;
            font-size: 20px;
        }

        /* Settings Panel */
        #settings-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 100%;
            background-color: #2B2D31;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            border-right: 1px solid #232428;
            padding: 20px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        #settings-panel.open {
            transform: translateX(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .settings-group {
            margin-bottom: 15px;
        }

        .settings-label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #B9BBBE;
        }

        .settings-input {
            width: 100%;
            padding: 10px;
            background-color: #40444B;
            border: none;
            border-radius: 4px;
            color: white;
        }

        .save-settings-btn {
            width: 100%;
            padding: 10px;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Alert Overlays */
        .alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .blinker-alert {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        .alert-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .blinker-title {
            color: #ED4245;
        }

        .vape-title {
            color: #3BA55C;
        }

        /* Stealth Mode */
        #stealth-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            z-index: 10000;
            display: none;
            flex-direction: column;
        }

        .stealth-video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stealth-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
        }

        /* Emoji Picker Container */
        #emoji-picker-container {
            position: absolute;
            bottom: 70px;
            right: 20px;
            z-index: 50;
        }

        /* Link Embed Styles */
        .link-embed {
            background-color: #2B2D31;
            border-left: 4px solid #5865F2;
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            max-width: 100%;
            word-break: break-all;
            cursor: pointer;
            transition: background 0.2s;
        }

        .link-embed:hover {
            background-color: #3F4147;
        }

        .link-embed-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .link-embed-url {
            font-size: 12px;
            color: #B9BBBE;
        }

        /* Lobby Screen */
        #lobby-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #313338;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lobby-card {
            background-color: #383A40;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 400px;
        }

        .lobby-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #202225;
            border: none;
            border-radius: 5px;
            color: white;
        }

        .lobby-btn {
            padding: 10px 20px;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Mod Tools */
        #mod-tools-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #2B2D31;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 100;
            display: none;
        }

        .mod-tool-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background-color: #40444B;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .mod-tool-btn:hover {
            background-color: #5865F2;
        }

        /* Call Modal */
        #call-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #2B2D31;
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            display: none;
            min-width: 300px;
        }

        .call-modal-content {
            margin-bottom: 15px;
        }

        /* Video Overlay */
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #18191C;
            z-index: 500;
            display: none;
            flex-direction: column;
        }

        .remote-video-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .local-video-player {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .video-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .video-control-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .mute-btn {
            background-color: #ED4245;
            color: white;
        }

        .hangup-btn {
            background-color: #ED4245;
            color: white;
        }

        /* Gradient Name Class */
        .gradient-name {
            background: linear-gradient(to right, #ff00cc, #333399);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Rules Modal */
        #rules-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #2B2D31;
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            display: none;
            width: 500px;
        }

        .rules-textarea {
            width: 100%;
            height: 200px;
            background-color: #40444B;
            border: none;
            border-radius: 5px;
            color: white;
            padding: 10px;
            margin-bottom: 15px;
        }

        /* Dev Menu */
        #dev-menu {
            position: absolute;
            background-color: #111111;
            border: 1px solid #00FF00;
            padding: 10px;
            border-radius: 5px;
            z-index: 10000;
            display: none;
        }

        .dev-btn {
            display: block;
            width: 100%;
            padding: 5px;
            margin-bottom: 5px;
            background-color: #333;
            color: #00FF00;
            border: none;
            cursor: pointer;
            text-align: left;
        }

        .dev-btn:hover {
            background-color: #00FF00;
            color: #000;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2B2D31;
        }

        ::-webkit-scrollbar-thumb {
            background: #1A1B1E;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5865F2;
        }
    </style>
</head>
<body>

    <!-- Lobby Screen -->
    <div id="lobby-screen">
        <div class="lobby-card">
            <h2>Welcome to SchoolChat</h2>
            <p>Customize your lobby experience</p>
            <img id="lobby-preview" src="" alt="Lobby Preview" style="max-width: 100%; height: 150px; object-fit: cover; margin: 10px 0; border-radius: 5px;">
            <input type="text" id="lobby-bg-input" class="lobby-input" placeholder="Enter image URL for background...">
            <button id="join-session-btn" class="lobby-btn">Join Study Session</button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>SchoolChat</h2>
            <button id="stealth-toggle-btn" class="call-btn" style="padding: 5px 10px; font-size: 12px;">Stealth</button>
        </div>
        
        <div class="user-profile" id="user-profile-btn">
            <img id="user-avatar" src="https://via.placeholder.com/32" alt="Avatar" class="avatar">
            <div class="user-info">
                <div id="user-username" class="username-display">Loading...</div>
                <span style="font-size: 12px; color: #B9BBBE;">Online</span>
            </div>
        </div>

        <div class="friend-list-container" id="friends-container">
            <!-- Friends will be rendered here -->
        </div>

        <div class="add-friend-section">
            <input type="text" id="add-friend-input" class="add-friend-input" placeholder="Email or Username...">
            <button id="add-friend-btn" class="add-friend-btn">+ Add Friend</button>
            <button id="logout-btn" class="logout-btn">Log Out</button>
        </div>
    </div>

    <!-- Chat Area -->
    <div id="chat-area">
        <div class="chat-header">
            <h3 id="current-chat-name">#general</h3>
            <div style="display: flex; gap: 10px;">
                <button id="call-btn" class="call-btn">Call</button>
                <button id="blinker-btn" class="call-btn" style="background-color: #ED4245;">Blinker</button>
                <button id="vape-btn" class="call-btn" style="background-color: #3BA55C;">Vape Break</button>
                <button id="rules-btn" class="call-btn" style="background-color: #5865F2;">Rules</button>
            </div>
        </div>

        <div class="messages-container" id="messages">
            <!-- Messages will appear here -->
        </div>

        <div class="input-area">
            <input type="file" id="image-upload" accept="image/*" style="display: none;">
            <button id="upload-btn" class="attach-btn">📎</button>
            <input type="text" id="msg-input" class="msg-input" placeholder="Message #general">
            <button id="emoji-trigger" class="emoji-btn">😊</button>
        </div>

        <!-- Emoji Picker Container -->
        <div id="emoji-picker-container"></div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel">
        <div class="settings-header">
            <h3>Settings</h3>
            <button id="close-settings-btn" class="call-btn" style="background-color: #ED4245;">X</button>
        </div>
        <div class="settings-group">
            <label class="settings-label">Username</label>
            <input type="text" id="settings-username" class="settings-input">
        </div>
        <div class="settings-group">
            <label class="settings-label">Avatar URL</label>
            <input type="text" id="settings-avatar" class="settings-input">
        </div>
        <div class="settings-group">
            <label class="settings-label">Name Color</label>
            <input type="color" id="settings-color" class="settings-input" value="#ffffff">
        </div>
        <div class="settings-group">
            <label class="settings-label">Gradient Names</label>
            <input type="checkbox" id="settings-gradient-toggle">
        </div>
        <div class="settings-group">
            <label class="settings-label">Chat Background Image (URL)</label>
            <input type="text" id="settings-bg-url" class="settings-input" placeholder="Image URL...">
        </div>
        <button id="save-settings-btn" class="save-settings-btn">Save Changes</button>
    </div>

    <!-- Blinker Alert -->
    <div id="blinker-alert" class="alert-overlay blinker-alert">
        <div class="alert-title blinker-title">BLINKER ALERT!</div>
        <p style="font-size: 24px;">Teacher is watching!</p>
    </div>

    <!-- Vape Alert -->
    <div id="vape-alert" class="alert-overlay">
        <div class="alert-title vape-title">VAPE BREAK TIME</div>
        <p style="font-size: 24px;">Take a breath, clear your head.</p>
    </div>

    <!-- Stealth Layer -->
    <div id="stealth-layer">
        <div class="stealth-video-container">
            <iframe id="stealth-iframe" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1" 
                    frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen style="width: 100%; height: 100%;"></iframe>
            <div class="stealth-overlay">
                <h3>Mr. Anderson's Math Class</h3>
                <p>Chapter 4: Calculus Basics</p>
            </div>
        </div>
    </div>

    <!-- Mod Tools Panel -->
    <div id="mod-tools-panel">
        <h3 style="margin-bottom: 10px;">Mod Tools</h3>
        <button class="mod-tool-btn" id="delete-msg-btn">Delete Message</button>
        <button class="mod-tool-btn" id="edit-msg-btn">Edit Message</button>
        <button class="mod-tool-btn" id="view-data-btn">View Data</button>
        <button class="mod-tool-btn" id="close-mod-tools-btn" style="background-color: #ED4245;">Close</button>
    </div>

    <!-- Call Modal -->
    <div id="call-modal">
        <div class="call-modal-content">
            <h3>Your ID: <span id="my-peer-id">Generating...</span></h3>
        </div>
        <div class="call-modal-content">
            <input type="text" id="room-id-input" class="settings-input" placeholder="Enter Room ID or leave blank to generate">
            <button id="create-room-btn" class="save-settings-btn">Create/Join Room</button>
        </div>
        <div id="active-room-info" style="margin-top: 10px; font-size: 12px; color: #B9BBBE;"></div>
        <button id="close-call-modal-btn" class="call-btn" style="margin-top: 10px; background-color: #ED4245;">Close</button>
    </div>

    <!-- Video Overlay -->
    <div id="video-overlay">
        <div class="remote-video-container">
            <video id="remote-video" autoplay playsinline style="max-width: 100%; max-height: 100%;"></video>
        </div>
        <div class="local-video-player">
            <video id="local-video" autoplay muted playsinline></video>
        </div>
        <div class="video-controls">
            <button id="mute-btn" class="video-control-btn mute-btn">Mute</button>
            <button id="hangup-btn" class="video-control-btn hangup-btn">Hang Up</button>
        </div>
    </div>

    <!-- Rules Modal -->
    <div id="rules-modal">
        <h3>Server Rules</h3>
        <textarea id="rules-textarea" class="rules-textarea"></textarea>
        <button id="save-rules-btn" class="save-settings-btn">Save Rules</button>
        <button id="close-rules-btn" class="call-btn" style="margin-top: 10px; background-color: #ED4245;">Close</button>
    </div>

    <!-- Dev Menu -->
    <div id="dev-menu">
        <button class="dev-btn" id="dev-delete-btn">Delete Message</button>
        <button class="dev-btn" id="dev-edit-btn">Edit Message</button>
        <button class="dev-btn" id="dev-view-btn">View Data</button>
    </div>

    <script>
        // --- Firebase Configuration ---
        const firebaseConfig = {

            databaseURL: "https://schoolchat-7f5a5-default-rtdb.firebaseio.com",

            measurementId: "G-QS6SVMF7FE"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- Global Variables ---
        let currentUser = null;
        let currentChatId = "general";
        let peer = null;

        let activeRoomId = null;
        let unsubMessages = null;
        let emojiPicker = null;

        // --- DOM Elements ---
        const els = {
            lobbyScreen: document.getElementById('lobby-screen'),
            lobbyBgInput: document.getElementById('lobby-bg-input'),
            lobbyPreview: document.getElementById('lobby-preview'),
            joinBtn: document.getElementById('join-session-btn'),
            sidebar: document.getElementById('sidebar'),
            friendsContainer: document.getElementById('friends-container'),
            addFriendInput: document.getElementById('add-friend-input'),
            addFriendBtn: document.getElementById('add-friend-btn'),
            logoutBtn: document.getElementById('logout-btn'),
            chatArea: document.getElementById('chat-area'),
            chatName: document.getElementById('current-chat-name'),
            messagesContainer: document.getElementById('messages'),
            msgInput: document.getElementById('msg-input'),
            uploadBtn: document.getElementById('upload-btn'),
            imageUpload: document.getElementById('image-upload'),
            emojiTrigger: document.getElementById('emoji-trigger'),
            emojiPickerContainer: document.getElementById('emoji-picker-container'),
            settingsPanel: document.getElementById('settings-panel'),
            userProfileBtn: document.getElementById('user-profile-btn'),
            closeSettingsBtn: document.getElementById('close-settings-btn'),
            settingsUsername: document.getElementById('settings-username'),
            settingsAvatar: document.getElementById('settings-avatar'),
            settingsColor: document.getElementById('settings-color'),
            settingsGradientToggle: document.getElementById('settings-gradient-toggle'),
            settingsBgUrl: document.getElementById('settings-bg-url'),
            saveSettingsBtn: document.getElementById('save-settings-btn'),
            userAvatar: document.getElementById('user-avatar'),
            userUsername: document.getElementById('user-username'),
            stealthToggleBtn: document.getElementById('stealth-toggle-btn'),
            stealthLayer: document.getElementById('stealth-layer'),
            stealthIframe: document.getElementById('stealth-iframe'),
            blinkerAlert: document.getElementById('blinker-alert'),
            vapeAlert: document.getElementById('vape-alert'),
            callBtn: document.getElementById('call-btn'),
            blinkerBtn: document.getElementById('blinker-btn'),
            vapeBtn: document.getElementById('vape-btn'),
            rulesBtn: document.getElementById('rules-btn'),
            rulesModal: document.getElementById('rules-modal'),
            rulesTextarea: document.getElementById('rules-textarea'),
            saveRulesBtn: document.getElementById('save-rules-btn'),
            closeRulesBtn: document.getElementById('close-rules-btn'),
            modToolsBtn: null, // Will be set below
            modToolsPanel: document.getElementById('mod-tools-panel'),
            deleteMsgBtn: document.getElementById('delete-msg-btn'),
            editMsgBtn: document.getElementById('edit-msg-btn'),
            viewDataBtn: document.getElementById('view-data-btn'),
            closeModToolsBtn: document.getElementById('close-mod-tools-btn'),
            callModal: document.getElementById('call-modal'),
            myPeerId: document.getElementById('my-peer-id'),
            roomIdInput: document.getElementById('room-id-input'),
            createRoomBtn: document.getElementById('create-room-btn'),
            activeRoomInfo: document.getElementById('active-room-info'),
            closeCallModalBtn: document.getElementById('close-call-modal-btn'),
            videoOverlay: document.getElementById('video-overlay'),
            remoteVideo: document.getElementById('remote-video'),
            localVideo: document.getElementById('local-video'),
            muteBtn: document.getElementById('mute-btn'),
            hangupBtn: document.getElementById('hangup-btn'),
            devMenu: document.getElementById('dev-menu'),
            devDeleteBtn: document.getElementById('dev-delete-btn'),
            devEditBtn: document.getElementById('dev-edit-btn'),
            devViewBtn: document.getElementById('dev-view-btn')
        };

        // Create Mod Tools Button dynamically if not present in HTML structure explicitly linked
        // Assuming it's triggered by a specific key or element, but we have the panel ready.
        // Let's add a trigger button to the header if needed, but for now, we'll use a hotkey or existing button logic.
        // Actually, let's just make sure the panel works. We need a way to open it. 
        // I'll add a small floating button or use a key combo. Let's use Shift + M for Mod Tools.
        
        window.currentMsgId = null;

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            initEmojiPicker();
            setupEventListeners();
            checkAuthState();
        });

        function initEmojiPicker() {
            emojiPicker = new EmojiButton({
                theme: 'auto',
                position: 'top-start'
            });
            
            els.emojiTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                emojiPicker.togglePicker(els.emojiPickerContainer);
            });

            emojiPicker.on('emoji', selection => {
                const pos = els.msgInput.selectionStart;
                const end = els.msgInput.selectionEnd;
                els.msgInput.value = els.msgInput.value.substring(0, pos) + selection.emoji + els.msgInput.value.substring(end);
                els.msgInput.focus();
                emojiPicker.hidePicker();
            });
            
            document.addEventListener('click', (e) => {
                if (!els.emojiPickerContainer.contains(e.target) && e.target !== els.emojiTrigger) {
                    emojiPicker.hidePicker();
                }
            });
        }

        function setupEventListeners() {
            // Lobby
            els.lobbyBgInput.addEventListener('input', (e) => {
                const url = e.target.value;
                els.lobbyPreview.src = url || 'https://via.placeholder.com/400x150';
            });

            els.joinBtn.addEventListener('click', () => {
                const bgUrl = els.lobbyBgInput.value;
                if (bgUrl) {
                    updateProfileBackground(bgUrl);
                }
                els.lobbyScreen.style.display = 'none';
            });

            // Settings
            els.userProfileBtn.addEventListener('click', () => toggleSettings(true));
            els.closeSettingsBtn.addEventListener('click', () => toggleSettings(false));
            els.saveSettingsBtn.addEventListener('click', saveSettings);

            // Add Friend
            els.addFriendBtn.addEventListener('click', addFriend);

            // Logout
            els.logoutBtn.addEventListener('click', () => {
                auth.signOut().then(() => {
                    window.location.href = 'index.html';
                });
            });

            // Chat Actions
            els.callBtn.addEventListener('click', openCallModal);
            els.blinkerBtn.addEventListener('click', () => triggerAlert('blinker'));
            els.vapeBtn.addEventListener('click', () => triggerAlert('vape'));
            els.rulesBtn.addEventListener('click', openRulesModal);

            // Stealth Mode
            els.stealthToggleBtn.addEventListener('click', toggleStealthMode);
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'CapsLock') {
                    e.preventDefault();
                    toggleStealthMode();
                }
                // Dev Menu Hotkey
                if (e.shiftKey && e.key === 'Enter') {
                    e.preventDefault();
                    toggleDevMenu(e.clientX, e.clientY);
                }
                // Mod Tools Hotkey
                if (e.shiftKey && e.key === 'm') {
                    e.preventDefault();
                    toggleModTools();
                }
            });

            // Input Handling
            els.msgInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            els.uploadBtn.addEventListener('click', () => els.imageUpload.click());
            els.imageUpload.addEventListener('change', handleImageUpload);

            // Mod Tools
            els.deleteMsgBtn.addEventListener('click', deleteMessage);
            els.editMsgBtn.addEventListener('click', editMessage);
            els.viewDataBtn.addEventListener('click', showRawData);
            els.closeModToolsBtn.addEventListener('click', () => els.modToolsPanel.style.display = 'none');

            // Call Modal
            els.createRoomBtn.addEventListener('click', createOrJoinRoom);
            els.closeCallModalBtn.addEventListener('click', () => els.callModal.style.display = 'none');

            // Video Controls
            els.muteBtn.addEventListener('click', toggleMute);
            els.hangupBtn.addEventListener('click', endCall);

            // Rules
            els.saveRulesBtn.addEventListener('click', saveRules);
            els.closeRulesBtn.addEventListener('click', () => els.rulesModal.style.display = 'none');

            // Dev Menu
            els.devDeleteBtn.addEventListener('click', deleteMessage);
            els.devEditBtn.addEventListener('click', editMessage);
            els.devViewBtn.addEventListener('click', showRawData);
        }

        // --- Authentication & User Data ---
        function checkAuthState() {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    await loadUserData();
                    renderFriends();
                    listenToMessages(currentChatId);
                    checkForAlerts();
                    setupDevMode();
                } else {
                    window.location.href = 'index.html';
                }
            });
        }

        async function loadUserData() {
            const docRef = db.collection('users').doc(currentUser.uid);
            docRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    updateUserUI(data);
                }
            });
        }

        function updateUserUI(data) {
            els.userUsername.textContent = data.username || 'User';
            els.userUsername.className = 'username-display ' + (data.gradient ? 'gradient-name' : '');
            els.userUsername.style.color = data.nameColor || '#ffffff';
            els.userAvatar.src = data.avatar || 'https://via.placeholder.com/32';
            
            if (data.chatBackground) {
                els.chatArea.style.backgroundImage = `url(${data.chatBackground})`;
                els.chatArea.style.backgroundSize = 'cover';
                els.chatArea.style.backgroundPosition = 'center';
            } else {
                els.chatArea.style.backgroundImage = 'none';
            }

            // Populate settings fields
            els.settingsUsername.value = data.username || '';
            els.settingsAvatar.value = data.avatar || '';
            els.settingsColor.value = data.nameColor || '#ffffff';
            els.settingsGradientToggle.checked = !!data.gradient;
            els.settingsBgUrl.value = data.chatBackground || '';
        }

        function toggleSettings(show) {
            if (show) {
                els.settingsPanel.classList.add('open');
            } else {
                els.settingsPanel.classList.remove('open');
            }
        }

        async function saveSettings() {
            const updates = {
                username: els.settingsUsername.value,
                avatar: els.settingsAvatar.value,
                nameColor: els.settingsColor.value,
                gradient: els.settingsGradientToggle.checked,
                chatBackground: els.settingsBgUrl.value
            };
            
            try {
                await db.collection('users').doc(currentUser.uid).update(updates);
                toggleSettings(false);
            } catch (error) {
                console.error("Error saving settings: ", error);
                alert("Failed to save settings.");
            }
        }

        function updateProfileBackground(url) {
            db.collection('users').doc(currentUser.uid).update({
                chatBackground: url
            }).catch(err => console.error("Error updating background:", err));
        }

        // --- Messaging System ---
        function sendMessage() {
            const text = els.msgInput.value.trim();
            if (!text) return;

            const messageData = {
                senderId: currentUser.uid,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                chatId: currentChatId
            };

            db.collection('chats').doc(currentChatId).collection('messages').add(messageData)
                .then(() => {
                    els.msgInput.value = '';
                })
                .catch(err => console.error("Error sending message: ", err));
        }

        function listenToMessages(chatId) {
            // Unsubscribe from previous listener if exists
            if (unsubMessages) {
                unsubMessages();
            }

            unsubMessages = db.collection('chats').doc(chatId).collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            renderMessage(change.doc.data(), change.doc.id);
                        }
                    });
                    scrollToBottom();
                });
        }

        function renderMessage(data, id) {
            const isSelf = data.senderId === currentUser.uid;
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isSelf ? 'self' : 'other'}`;
            msgDiv.dataset.id = id;

            const authorDiv = document.createElement('div');
            authorDiv.className = 'message-author';
            authorDiv.textContent = data.senderUsername || 'Unknown';
            authorDiv.style.color = data.senderNameColor || '#ffffff';
            if (data.senderGradient) {
                authorDiv.classList.add('gradient-name');
            }

            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            
            // Handle Links
            if (data.text.startsWith('http')) {
                const embedDiv = document.createElement('div');
                embedDiv.className = 'link-embed';
                embedDiv.innerHTML = `<div class="link-embed-title">${data.text}</div>`;
                embedDiv.onclick = () => window.open(data.text, '_blank');
                textDiv.appendChild(embedDiv);
            } else {
                textDiv.textContent = data.text;
            }

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            const date = data.timestamp ? new Date(data.timestamp.seconds * 1000) : new Date();
            timeDiv.textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            msgDiv.appendChild(authorDiv);
            msgDiv.appendChild(textDiv);
            msgDiv.appendChild(timeDiv);

            els.messagesContainer.appendChild(msgDiv);
        }

        function scrollToBottom() {
            els.messagesContainer.scrollTop = els.messagesContainer.scrollHeight;
        }

        // --- Fix: Switch Chat Logic (Step 1) ---
        function switchChat(chatId) {
            currentChatId = chatId;
            els.chatName.textContent = "#" + chatId;
            els.messagesContainer.innerHTML = "";
            els.msgInput.placeholder = "Message #" + chatId;
            listenToMessages(chatId);
            scrollToBottom();
        }

        // --- Friends System ---
        async function addFriend() {
            const query = els.addFriendInput.value.trim();
            if (!query) return;

            try {
                let targetUser = null;
                
                // Try finding by email first
                const emailQuery = await db.collection('users').where('email', '==', query).get();
                if (!emailQuery.empty) {
                    targetUser = emailQuery.docs[0].data();
                } else {
                    // Fallback to username prefix search
                    const usernameQuery = await db.collection('users').where('username', '>=', query).limit(1).get();
                    if (!usernameQuery.empty) {
                        targetUser = usernameQuery.docs[0].data();
                    }
                }

                if (targetUser) {
                    if (targetUser.uid === currentUser.uid) {
                        alert("You can't add yourself!");
                        return;
                    }
                    
                    const friendUpdate = {
                        friends: firebase.firestore.FieldValue.arrayUnion(targetUser.uid)
                    };
                    
                    await db.collection('users').doc(currentUser.uid).update(friendUpdate);
                    els.addFriendInput.value = '';
                    renderFriends(); // Refresh list
                } else {
                    alert("User not found.");
                }
            } catch (error) {
                console.error("Error adding friend: ", error);
                alert("Could not find user.");
            }
        }

        function renderFriends() {
            els.friendsContainer.innerHTML = '';
            
            if (!currentUser) return;

            db.collection('users').doc(currentUser.uid).onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    const friendUids = data.friends || [];
                    
                    friendUids.forEach(uid => {
                        db.collection('users').doc(uid).get().then((snap) => {
                            if (snap.exists) {
                                const friendData = snap.data();
                                const item = document.createElement('div');
                                item.className = 'friend-item';
                                
                                const avatar = document.createElement('img');
                                avatar.src = friendData.avatar || 'https://via.placeholder.com/24';
                                avatar.className = 'friend-avatar';
                                
                                const name = document.createElement('span');
                                name.textContent = friendData.username || 'User';
                                name.className = 'friend-name';
                                
                                const status = document.createElement('div');
                                status.className = 'status-dot online'; // Assume online for demo
                                
                                item.appendChild(avatar);
                                item.appendChild(name);
                                item.appendChild(status);
                                
                                item.addEventListener('click', () => {
                                    // In a real app, this might open a DM. 
                                    // For now, let's just highlight or switch to a 'DM-' channel if implemented.
                                    // Since we only have 'general' and friends, let's assume clicking a friend opens their profile or a private chat if we had one.
                                    // For this version, let's just log it or switch to a hypothetical private chat.
                                    alert(`Chatting with ${friendData.username} (Feature coming soon!)`);
                                });
                                
                                els.friendsContainer.appendChild(item);
                            }
                        });
                    });
                }
            });
        }

        // --- Alerts System ---
        function triggerAlert(type) {
            const alertData = {
                type: type,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            db.collection('alerts').add(alertData);
        }

        function checkForAlerts() {
            db.collection('alerts').orderBy('timestamp', 'desc').limit(1).onSnapshot((snapshot) => {
                if (!snapshot.empty) {
                    const latestAlert = snapshot.docs[0].data();
                    const now = new Date();
                    const alertTime = latestAlert.timestamp ? new Date(latestAlert.timestamp.seconds * 1000) : new Date(0);
                    
                    if ((now - alertTime) < 5000) { // 5 seconds
                        showAlert(latestAlert.type);
                    }
                }
            });
        }

        function showAlert(type) {
            const alertEl = type === 'blinker' ? els.blinkerAlert : els.vapeAlert;
            alertEl.style.display = 'flex';
            setTimeout(() => {
                alertEl.style.display = 'none';
            }, 3000);
        }

        // --- Stealth Mode ---
        function toggleStealthMode() {
            const isVisible = els.stealthLayer.style.display === 'flex';
            if (isVisible) {
                els.stealthLayer.style.display = 'none';
                // Reload iframe to stop video
                els.stealthIframe.src = els.stealthIframe.src;
            } else {
                els.stealthLayer.style.display = 'flex';
                // Start video
                els.stealthIframe.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1";
            }
        }

        // --- Emoji Picker Integration ---
        // Already handled in initEmojiPicker

        // --- Image Upload ---
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const imageUrl = event.target.result;
                const messageData = {
                    senderId: currentUser.uid,
                    text: imageUrl,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    chatId: currentChatId,
                    isImage: true
                };

                db.collection('chats').doc(currentChatId).collection('messages').add(messageData)
                    .then(() => {
                        els.imageUpload.value = ''; // Reset input
                    });
            };
            reader.readAsDataURL(file);
        }

        // --- Mod Tools ---
        function toggleModTools() {
            const isHidden = els.modToolsPanel.style.display === 'none' || els.modToolsPanel.style.display === '';
            els.modToolsPanel.style.display = isHidden ? 'block' : 'none';
        }

        function deleteMessage() {
            if (!window.currentMsgId) {
                alert("No message selected. Click on a message first.");
                return;
            }
            db.collection('chats').doc(currentChatId).collection('messages').doc(window.currentMsgId).delete()
                .then(() => {
                    alert("Message deleted.");
                    els.modToolsPanel.style.display = 'none';
                })
                .catch(err => console.error("Error deleting message: ", err));
        }

        function editMessage() {
            if (!window.currentMsgId) {
                alert("No message selected. Click on a message first.");
                return;
            }
            const newText = prompt("Enter new message text:");
            if (newText !== null) {
                db.collection('chats').doc(currentChatId).collection('messages').doc(window.currentMsgId).update({
                    text: newText
                })
                .then(() => {
                    alert("Message edited.");
                    els.modToolsPanel.style.display = 'none';
                })
                .catch(err => console.error("Error editing message: ", err));
            }
        }

        function showRawData() {
            if (!window.currentMsgId) {
                alert("No message selected.");
                return;
            }
            db.collection('chats').doc(currentChatId).collection('messages').doc(window.currentMsgId).get()
                .then((doc) => {
                    alert(JSON.stringify(doc.data(), null, 2));
                });
        }

        // --- Dev Menu ---
        function setupDevMode() {
            // Highlight message on click
            document.addEventListener('click', (e) => {
                const msgElement = e.target.closest('.message');
                if (msgElement) {
                    window.currentMsgId = msgElement.dataset.id;
                    // Optional: Visual feedback like border
                    document.querySelectorAll('.message').forEach(m => m.style.border = 'none');
                    msgElement.style.border = '2px solid #5865F2';
                } else {
                    // Clear selection if clicking outside
                    // document.querySelectorAll('.message').forEach(m => m.style.border = 'none');
                    // window.currentMsgId = null;
                }
            });
        }

        function toggleDevMenu(x, y) {
            if (els.devMenu.style.display === 'block') {
                els.devMenu.style.display = 'none';
            } else {
                els.devMenu.style.display = 'block';
                els.devMenu.style.left = `${x}px`;
                els.devMenu.style.top = `${y}px`;
            }
        }

        // --- Video Calls (PeerJS) ---
        function openCallModal() {
            els.callModal.style.display = 'block';
            if (!peer) {
                initPeer();
            }
        }

        function initPeer() {
            peer = new Peer();
            
            peer.on('open', (id) => {
                els.myPeerId.textContent = id;
            });

            peer.on('call', (call) => {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .then((stream) => {
                        myStream = stream;
                        els.localVideo.srcObject = stream;
                        call.answer(stream);
                        
                        call.on('stream', (remoteStream) => {
                            setupVideoCall(remoteStream);
                        });
                    })
                    .catch((err) => {
                        console.error('Failed to get local stream', err);
                    });
            });
        }

        function createOrJoinRoom() {
            const roomId = els.roomIdInput.value.trim() || Math.random().toString(36).substring(2, 8);
            activeRoomId = roomId;
            els.activeRoomInfo.textContent = `Room ID: ${roomId}`;
            
            // If creating, wait for peer open then broadcast or connect
            // For simplicity, let's assume we are connecting to a known ID or generating a room where others can join.
            // Since this is P2P, we need the other person's ID. 
            // Let's simplify: Generate an ID, show it. The user shares it.
            // Or, if they enter an ID, connect to it.
            
            if (els.roomIdInput.value.trim()) {
                connectCall(els.roomIdInput.value.trim());
            } else {
                // Just show the ID for them to share
                alert(`Your Room ID is: ${roomId}. Share this with your friend!`);
            }
        }

        function connectCall(targetId) {
            if (!peer) return;
            
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then((stream) => {
                    myStream = stream;
                    els.localVideo.srcObject = stream;
                    
                    const call = peer.call(targetId, stream);
                    if (call) {
                        call.on('stream', (remoteStream) => {
                            setupVideoCall(remoteStream);
                        });
                        call.on('close', () => {
                            endCall();
                        });
                    }
                })
                .catch((err) => {
                    console.error('Failed to get local stream', err);
                });
        }

        function setupVideoCall(remoteStream) {
            els.remoteVideo.srcObject = remoteStream;
            els.videoOverlay.style.display = 'flex';
            els.callModal.style.display = 'none';
        }

        function endCall() {
            if (myStream) {
                myStream.getTracks().forEach(track => track.stop());
                myStream = null;
            }
            if (peer) {
                peer.disconnect();
                peer = null;
            }
            els.videoOverlay.style.display = 'none';
            els.remoteVideo.srcObject = null;
            els.localVideo.srcObject = null;
            els.callModal.style.display = 'none';
            els.roomIdInput.value = '';
            activeRoomId = null;
        }

        function toggleMute() {
            if (myStream) {
                const audioTrack = myStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    els.muteBtn.textContent = audioTrack.enabled ? 'Mute' : 'Unmute';
                    els.muteBtn.style.backgroundColor = audioTrack.enabled ? '#ED4245' : '#3BA55C';
                }
            }
        }

        // --- Rules System ---
        function openRulesModal() {
            els.rulesModal.style.display = 'block';
            db.collection('chats').doc(currentChatId).get().then((doc) => {
                if (doc.exists) {
                    els.rulesTextarea.value = doc.data().rules || "1. Be respectful.\n2. No spam.\n3. Have fun.";
                } else {
                    els.rulesTextarea.value = "1. Be respectful.\n2. No spam.\n3. Have fun.";
                }
            });
        }

        function saveRules() {
            const rules = els.rulesTextarea.value;
            db.collection('chats').doc(currentChatId).set({
                rules: rules
            }, { merge: true })
            .then(() => {
                els.rulesModal.style.display = 'none';
            });
        }

    </script>
