<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SchoolChat</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- PeerJS for Video Calls -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Emoji Picker -->
    <script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.3/dist/index.min.js"></script>

    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #313338; color: white; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 260px; background: #2B2D31; display: flex; flex-direction: column; border-right: 1px solid #232428; transition: transform 0.3s; }
        .header { padding: 15px; font-weight: bold; background: #202225; border-bottom: 1px solid #232428; display: flex; justify-content: space-between; align-items: center; }
        .friend-list { flex: 1; overflow-y: auto; padding: 10px; }
        .friend-item { padding: 10px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; margin-bottom: 2px; position: relative; }
        .friend-item:hover { background: #35373C; }
        .friend-item.active { background: #3F4147; }
        .status-dot { width: 8px; height: 8px; background: #747F8D; border-radius: 50%; position: absolute; bottom: 10px; right: 10px; border: 2px solid #35373C; }
        .friend-item.active .status-dot { border-color: #3F4147; }
        .online .status-dot { background: #3BA55C; }
        
        .avatar { width: 32px; height: 32px; background: #5865F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; overflow: hidden; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .add-friend-section { padding: 10px; border-top: 1px solid #232428; }
        input[type="text"] { width: 90%; padding: 8px; border-radius: 4px; border: none; background: #40444B; color: white; margin-bottom: 5px; }
        
        /* Chat Area */
        #chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { height: 50px; border-bottom: 1px solid #232428; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: #2B2D31; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Message Styling */
        .message { max-width: 70%; padding: 10px 15px; border-radius: 18px; word-wrap: break-word; background: #40444B; position: relative; }
        .msg-self { align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-other { align-self: flex-start; border-bottom-left-radius: 4px; }
        
        /* Dynamic Name Styles */
        .msg-sender { font-size: 12px; margin-bottom: 4px; font-weight: bold; }
        .gradient-name {
            background: linear-gradient(to right, #ff00cc, #333399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Link Embeds */
        .link-embed { 
            background: #2B2D31; border-radius: 8px; padding: 10px; margin-top: 5px; 
            border-left: 4px solid #5865F2; display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: white; cursor: pointer; transition: 0.2s;
        }
        .link-embed:hover { background: #3F4147; }
        .link-icon { font-size: 24px; }
        .link-text { display: flex; flex-direction: column; }
        .link-title { font-weight: bold; font-size: 14px; }
        .link-url { font-size: 11px; color: #b9bbbe; text-decoration: underline; }

        .input-area { padding: 10px; background: #313338; display: flex; align-items: center; gap: 10px; }
        .input-wrapper { flex: 1; background: #40444B; border-radius: 8px; padding: 5px; display: flex; align-items: center; position: relative; }
        #msg-input { background: transparent; border: none; color: white; flex: 1; outline: none; padding: 10px; }
        
        /* Call & Actions */
        .call-btn { background: #5865F2; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .icon-btn { background: transparent; border: none; color: #b9bbbe; cursor: pointer; padding: 5px; font-size: 20px; }
        .icon-btn:hover { color: white; }
        
        /* Alerts */
        .alert-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 999; display: none; 
            justify-content: center; align-items: center; flex-direction: column;
        }
        .alert-box { 
            background: #2B2D31; padding: 40px; border-radius: 12px; text-align: center; 
            border: 2px solid #5865F2; animation: popIn 0.3s ease;
        }
        .alert-title { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .blink-alert .alert-title { color: #ED4245; animation: blink 0.5s infinite; }
        .vape-alert .alert-title { color: #3BA55C; }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Video Overlay */
        #video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #18191C; z-index: 100; display: none; flex-direction: column; }
        #remote-video-container { flex: 1; display: flex; justify-content: center; align-items: center; background: black; }
        #my-video { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 150px; background: #333; border-radius: 8px; border: 2px solid #5865F2; object-fit: cover; }
        .video-controls { padding: 20px; display: flex; justify-content: center; gap: 20px; background: #202225; }
        .control-btn { padding: 10px 20px; background: #ED4245; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .control-btn.green { background: #3BA55C; }
        
        /* Stealth Mode */
        #stealth-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: white; z-index: 10000; display: none; overflow: hidden;
        }
        #stealth-video { width: 100%; height: 100%; object-fit: cover; }
        #stealth-ui {
            position: absolute; bottom: 20px; left: 20px; color: black; 
            font-family: serif; font-size: 14px; pointer-events: none;
        }

        /* Settings / Profile Dropdown */
        #settings-panel {
            position: absolute; top: 50px; left: 10px; background: #2B2D31; 
            padding: 15px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 50; display: none; width: 220px;
        }
        .settings-header { font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #40444B; padding-bottom: 5px; }
        .setting-row { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; }
        .setting-row label { font-size: 12px; color: #b9bbbe; }
        .setting-row input[type="text"] { width: 100px; padding: 5px; font-size: 12px; margin: 0; }
        .setting-row input[type="color"] { width: 30px; height: 30px; border: none; padding: 0; background: none; cursor: pointer; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; cursor: pointer; }
        .save-btn { background: #3BA55C; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; width: 100%; margin-top: 5px; }

        #emoji-picker { position: absolute; bottom: 60px; left: 20px; z-index: 10; }
        
        /* Lobby Screen */
        #lobby-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #313338; z-index: 200; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        #lobby-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; z-index: -1;
            filter: brightness(0.4);
        }
        .lobby-card {
            background: #383A40; padding: 30px; border-radius: 12px; width: 400px;
            text-align: center; z-index: 1; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .lobby-input { width: 80%; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: none; background: #202225; color: white; }
        .join-btn { background: #5865F2; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

<!-- LOBBY SCREEN -->
<div id="lobby-screen">
    <div id="lobby-bg"></div>
    <div class="lobby-card">
        <h2>Study Session Setup</h2>
        <p style="color:#b9bbbe; font-size: 14px;">Customize your room background</p>
        <input type="text" id="lobby-image-link" class="lobby-input" placeholder="Paste Image URL for background..." oninput="updateLobbyPreview()">
        <img id="lobby-preview" class="preview-img" style="height: 150px; width: 100%; object-fit: cover; margin-bottom: 15px;">
        <button class="join-btn" onclick="enterChat()">Join Study Session</button>
    </div>
</div>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="header">
        <span>SchoolChat</span>
        <button id="stealth-toggle" onclick="toggleStealthUI()">👁️ Stealth</button>
    </div>
    
    <!-- User Profile / Settings -->
    <div style="padding: 10px; border-bottom: 1px solid #232428; position: relative;">
        <div onclick="toggleSettings()" style="cursor: pointer; display: flex; align-items: center; gap: 10px;">
            <div class="avatar" id="my-avatar-sidebar" style="width: 24px; height: 24px; font-size: 10px;"></div>
            <span id="my-username-display" style="font-size: 14px; font-weight: bold;">Loading...</span>
        </div>
        
        <!-- Settings Panel -->
        <div id="settings-panel">
            <div class="settings-header">Edit Profile</div>
            
            <div class="setting-row">
                <label>Username:</label>
                <input type="text" id="new-username-input" placeholder="New Name">
            </div>
            
            <div class="setting-row">
                <label>Avatar URL:</label>
                <input type="text" id="new-avatar-url" placeholder="Image URL...">
            </div>
            
            <div class="setting-row">
                <label>Name Color:</label>
                <input type="color" id="name-color-picker" value="#ffffff">
            </div>
            
            <label class="checkbox-row">
                <input type="checkbox" id="gradient-toggle"> Enable Gradient
            </label>
            
            <button class="save-btn" onclick="updateProfile()">Save Changes</button>
        </div>
    </div>

    <div class="friend-list" id="friends-container">
        <!-- Friends injected here -->
    </div>
    <div class="add-friend-section">
        <input type="text" id="friend-email" placeholder="Friend's Email or ID...">
        <button onclick="addFriend()" style="background:#5865F2; color:white; border:none; width:100%; padding:8px; border-radius:4px; cursor:pointer;">+ Add Friend</button>
    </div>
    <div style="padding: 10px; border-top: 1px solid #232428;">
        <button onclick="logout()" style="background:transparent; color:red; border:none; cursor:pointer; width:100%;">Log Out</button>
    </div>
</div>

<!-- MAIN CHAT -->
<div id="chat-area">
    <div class="chat-header">
        <span id="current-chat-name"># General</span>
        <div style="display: flex; gap: 10px;">
            <button class="call-btn" onclick="startCall()">📞 Call</button>
            <button class="call-btn" style="background: #ED4245;" onclick="triggerAlert('blinker')">⚡ Blinker</button>
            <button class="call-btn" style="background: #3BA55C;" onclick="triggerAlert('vape')">💨 Vape Break</button>
        </div>
    </div>
    <div id="messages"></div>
    <div class="input-area">
        <button class="icon-btn" onclick="document.getElementById('image-upload').click()">🔗</button>
        <input type="file" id="image-upload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        <div class="input-wrapper">
            <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="icon-btn" id="emoji-trigger">😊</button>
        </div>
    </div>
</div>

<!-- VIDEO CALL OVERLAY -->
<div id="video-overlay">
    <div id="remote-video-container">
        <video id="remote-video" autoplay playsinline style="max-width:100%; max-height:100%;"></video>
    </div>
    <video id="my-video" autoplay playsinline muted></video>
    <div class="video-controls">
        <button class="control-btn green" onclick="toggleMute()">🎤 Mute</button>
        <button class="control-btn" onclick="endCall()">📞 Hang Up</button>
    </div>
</div>

<!-- ALERTS -->
<div id="blinker-alert" class="alert-overlay blink-alert" onclick="this.style.display='none'">
    <div class="alert-box">
        <div class="alert-title">BLINKER!</div>
        <p>Take a blinker now!</p>
        <small>(Click to dismiss)</small>
    </div>
</div>

<div id="vape-alert" class="alert-overlay vape-alert" onclick="this.style.display='none'">
    <div class="alert-box">
        <div class="alert-title">VAPE BREAK</div>
        <p>Everyone take a vape break!</p>
        <small>(Click to dismiss)</small>
    </div>
</div>

<!-- STEALTH MODE LAYER -->
<div id="stealth-layer">
    <!-- Fake Math Video -->
    <iframe id="stealth-video" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <div id="stealth-ui">
        <strong>Mr. Anderson's Math Class</strong><br>
        Calculus: Derivatives<br>
        Chapter 4, Page 120
    </div>
</div>

<!-- EMOJI PICKER -->
<div id="emoji-picker"></div>

<script>
   // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
  authDomain: "schoolchat-7f5a5.firebaseapp.com",
  databaseURL: "https://schoolchat-7f5a5-default-rtdb.firebaseio.com",
  projectId: "schoolchat-7f5a5",
  storageBucket: "schoolchat-7f5a5.firebasestorage.app",
  messagingSenderId: "752691397853",
  appId: "1:752691397853:web:b4acd05e0259979edfc734",
  measurementId: "G-QS6SVMF7FE"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentChatId = "general"; 
    let peer = null;
    let myStream = null;
    let currentCallPeer = null;

    // AUTH CHECK
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            loadUserData();
            renderFriends();
            listenToMessages();
            initEmojiPicker();
            checkForAlerts();
        } else {
            window.location.href = "index.html";
        }
    });

    function loadUserData() {
        db.collection("users").doc(currentUser.uid).onSnapshot(doc => {
            const data = doc.data();
            const nameEl = document.getElementById('my-username-display');
            nameEl.innerText = data.username || currentUser.email.split('@')[0];
            
            // Apply styling
            nameEl.style.color = data.nameColor || "#FFFFFF";
            nameEl.className = data.gradientEnabled ? "gradient-name" : "";
            
            document.getElementById('new-username-input').value = data.username || "";
            document.getElementById('new-avatar-url').value = data.photoURL || "";
            document.getElementById('name-color-picker').value = data.nameColor || "#ffffff";
            document.getElementById('gradient-toggle').checked = data.gradientEnabled || false;

            // Update Avatar
            const avatarEl = document.getElementById('my-avatar-sidebar');
            if(data.photoURL) {
                avatarEl.innerHTML = `<img src="${data.photoURL}">`;
            } else {
                avatarEl.innerText = (data.username || "U")[0].toUpperCase();
            }
        });
    }

    // PROFILE UPDATE
    function updateProfile() {
        const newName = document.getElementById('new-username-input').value.trim();
        const newAvatar = document.getElementById('new-avatar-url').value.trim();
        const newColor = document.getElementById('name-color-picker').value;
        const isGradient = document.getElementById('gradient-toggle').checked;

        const updates = {};
        if(newName) updates.username = newName.toLowerCase();
        if(newAvatar) updates.photoURL = newAvatar;
        updates.nameColor = newColor;
        updates.gradientEnabled = isGradient;

        db.collection("users").doc(currentUser.uid).update(updates);
        toggleSettings();
    }

    function toggleSettings() {
        const panel = document.getElementById('settings-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    // LOBBY LOGIC
    function updateLobbyPreview() {
        const url = document.getElementById('lobby-image-link').value;
        const preview = document.getElementById('lobby-preview');
        const bg = document.getElementById('lobby-bg');
        if(url) {
            preview.src = url;
            bg.style.backgroundImage = `url('${url}')`;
        } else {
            preview.src = "";
            bg.style.backgroundImage = "none";
        }
    }

    function enterChat() {
        document.getElementById('lobby-screen').style.display = 'none';
    }

    // MESSAGE HANDLING
    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if(!text) return;

        const msgData = {
            senderId: currentUser.uid,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            chatId: currentChatId
        };

        db.collection("chats").doc(currentChatId).collection("messages").add(msgData);
        input.value = "";
    }

    function listenToMessages() {
        db.collection("chats").doc(currentChatId).collection("messages")
            .orderBy("timestamp", "asc")
            .onSnapshot(snapshot => {
                const container = document.getElementById('messages');
                container.innerHTML = ""; // Clear and redraw
                
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const isMe = msg.senderId === currentUser.uid;
                    
                    const div = document.createElement('div');
                    div.className = `message ${isMe ? 'msg-self' : 'msg-other'}`;
                    
                    // Check if it's a link
                    if(msg.text && msg.text.startsWith('http')) {
                        const domain = new URL(msg.text).hostname.replace('www.', '');
                        div.innerHTML = `
                            <div class="link-embed" onclick="window.open('${msg.text}', '_blank')">
                                <div class="link-icon">🔗</div>
                                <div class="link-text">
                                    <span class="link-title">${domain}</span>
                                    <span class="link-url">${msg.text.substring(0, 40)}...</span>
                                </div>
                            </div>
                        `;
                    } else {
                        // Get styling for the sender
                        const senderStyle = getSenderStyle(msg.senderId);
                        
                        div.innerHTML = `
                            ${!isMe ? `<div class="msg-sender" style="${senderStyle}">${getUsername(msg.senderId)}</div>` : ''}
                            ${msg.text}
                        `;
                    }
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
    }

    function getSenderStyle(uid) {
        // In a real app, you'd cache this. Here we just return empty string 
        // because fetching every user for every message is slow without caching.
        // However, we can try to fetch if not cached.
        return ""; 
    }

    function getUsername(uid) {
        return "User"; 
    }

    // FRIENDS & ALERTS
    function addFriend() {
        const target = document.getElementById('friend-email').value.trim();
        if(!target) return;

        db.collection("users").where("email", "==", target).get().then(snap => {
            if(snap.empty) {
                db.collection("users").where("username", ">=", target).limit(1).get().then(snap2 => {
                     if(!snap2.empty) {
                         const friendUid = snap2.docs[0].id;
                         addFriendRelation(friendUid);
                     } else alert("User not found");
                });
            } else {
                const friendUid = snap.docs[0].id;
                addFriendRelation(friendUid);
            }
        });
    }

    function addFriendRelation(uid) {
        if(uid === currentUser.uid) return;
        db.collection("users").doc(currentUser.uid).update({
            friends: firebase.firestore.FieldValue.arrayUnion(uid)
        });
        document.getElementById('friend-email').value = "";
    }

    function renderFriends() {
        const container = document.getElementById('friends-container');
        container.innerHTML = "<div class='friend-item active' onclick='switchChat(\"general\")'># General</div>";
        
        if(currentUser) {
            db.collection("users").doc(currentUser.uid).get().then(doc => {
                const data = doc.data();
                if(data.friends) {
                    data.friends.forEach(uid => {
                        db.collection("users").doc(uid).get().then(userDoc => {
                            const uData = userDoc.data();
                            const div = document.createElement('div');
                            div.className = "friend-item";
                            div.onclick = () => switchChat(uid);
                            
                            const avatarHtml = uData.photoURL 
                                ? `<img src="${uData.photoURL}">` 
                                : (uData.username || "?")[0].toUpperCase();
                                
                            div.innerHTML = `
                                <div class="avatar">${avatarHtml}</div>
                                <span>${uData.username || "Unknown"}</span>
                                <div class="status-dot"></div>
                            `;
                            container.appendChild(div);
                        });
                    });
                }
            });
        }
    }

    function switchChat(chatId) {
        currentChatId = chatId;
        document.getElementById('current-chat-name').innerText = chatId === "general" ? "# General" : "Direct Message";
    }

    // ALERTS
    function triggerAlert(type) {
        const payload = {
            type: type,
            timestamp: Date.now(),
            senderId: currentUser.uid
        };
        db.collection("alerts").add(payload);
    }

    function checkForAlerts() {
        db.collection("alerts").orderBy("timestamp", "desc").limit(1).onSnapshot(snap => {
            if(!snap.empty) {
                const alert = snap.docs[0].data();
                // Only show if it's recent (last 5 seconds)
                if(Date.now() - alert.timestamp < 5000) {
                    // Show if it's from someone else OR if it's from me (self-alerts enabled)
                    const el = document.getElementById(`${alert.type}-alert`);
                    if(el) {
                        el.style.display = "flex";
                        // Auto-hide after 3 seconds
                        setTimeout(() => { el.style.display = "none"; }, 3000);
                    }
                }
            }
        });
    }

    // STEALTH MODE (Shift + CapsLock)
    document.addEventListener('keydown', (e) => {
        // Left Shift is key 16, CapsLock is key 20
        if (e.shiftKey && e.code === 'CapsLock') {
            toggleStealthUI();
        }
    });

    function toggleStealthUI() {
        const layer = document.getElementById('stealth-layer');
        const iframe = document.getElementById('stealth-video');
        if(layer.style.display === 'none' || layer.style.display === '') {
            layer.style.display = 'block';
            iframe.src = iframe.src; 
        } else {
            layer.style.display = 'none';
        }
    }

    // VIDEO CALL
    function startCall() {
        const peerId = prompt("Enter Friend's Peer ID to call:");
        if(peerId) {
            connectCall(peerId);
        }
    }

    function connectCall(targetId) {
        if(!peer) initPeer();
        
        const call = peer.call(targetId, myStream);
        call.on('stream', remoteStream => {
            document.getElementById('remote-video').srcObject = remoteStream;
            document.getElementById('video-overlay').style.display = 'flex';
        });
    }

    function initPeer() {
        peer = new Peer(currentUser.uid); // Use UID as Peer ID
        peer.on('call', (call) => {
            call.answer(myStream);
            call.on('stream', remoteStream => {
                document.getElementById('remote-video').srcObject = remoteStream;
                document.getElementById('video-overlay').style.display = 'flex';
            });
        });
    }

    function endCall() {
        document.getElementById('video-overlay').style.display = 'none';
        if(myStream) myStream.getTracks().forEach(track => track.stop());
        if(peer) peer.disconnect();
        peer = null;
    }

    function toggleMute() {
        if(myStream) {
            myStream.getAudioTracks()[0].enabled = !myStream.getAudioTracks()[0].enabled;
        }
    }

    // INIT
    function initEmojiPicker() {
        const picker = new EmojiButton({ theme: 'dark' });
        const trigger = document.getElementById('emoji-trigger');
        const input = document.getElementById('msg-input');
        
        picker.init(document.getElementById('emoji-picker'));
        trigger.addEventListener('click', (e) => {
            picker.togglePicker(trigger);
        });
        picker.on('emoji', selection => {
            input.value += selection.emoji;
            input.focus();
        });
    }

    function logout() {
        auth.signOut().then(() => window.location.href = "index.html");
    }
</script>

</body>
</html>
