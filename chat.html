<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Chat Room</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <!-- PeerJS for Video Calls -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #2d2d2d;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .header {
            background-color: #007bff;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            font-size: 0.9rem;
            color: #e0e0e0;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            background-color: #3d3d3d;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.sent {
            background-color: #007bff;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message.received {
            background-color: #444;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .sender-name {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 3px;
        }

        .input-area {
            padding: 15px;
            background-color: #252525;
            display: flex;
            gap: 10px;
            border-top: 1px solid #444;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #555;
            background-color: #333;
            color: white;
            outline: none;
        }

        button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        #send-btn {
            background-color: #007bff;
            color: white;
        }

        #send-btn:hover {
            background-color: #0056b3;
        }

        #call-btn {
            background-color: #28a745;
            color: white;
            position: relative;
        }

        #call-btn:hover {
            background-color: #218838;
        }

        /* Call Modal Styles */
        #call-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #remote-video {
            width: 90%;
            max-width: 600px;
            background-color: #000;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        #local-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 200px;
            background-color: #333;
            border-radius: 10px;
            border: 2px solid #fff;
        }

        #end-call-btn {
            background-color: #dc3545;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
        }

        #status-msg {
            margin-top: 10px;
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2d2d2d; 
        }
        ::-webkit-scrollbar-thumb {
            background: #555; 
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>School Chat</span>
        <div class="user-info">
            ID: <span id="my-peer-id">Generating...</span>
            <button id="copy-id-btn" style="background:none; border:none; color:#ccc; font-size:0.8rem; cursor:pointer; padding:0;">[Copy]</button>
        </div>
    </div>

    <div id="messages">
        <!-- Messages will appear here -->
        <div class="message received">
            <div class="sender-name">System</div>
            Welcome! Enter your username below to start chatting.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="username-input" placeholder="Enter Username..." maxlength="15">
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
        <button id="call-btn">📞 Call</button>
    </div>
</div>

<!-- Call Interface Overlay -->
<div id="call-modal">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay muted playsinline></video>
    <p id="status-msg">Calling...</p>
    <button id="end-call-btn">End Call</button>
</div>

<script>
   // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
  authDomain: "schoolchat-7f5a5.firebaseapp.com",
  databaseURL: "https://schoolchat-7f5a5-default-rtdb.firebaseio.com",
  projectId: "schoolchat-7f5a5",
  storageBucket: "schoolchat-7f5a5.firebasestorage.app",
  messagingSenderId: "752691397853",
  appId: "1:752691397853:web:b4acd05e0259979edfc734",
  measurementId: "G-QS6SVMF7FE"
};
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // --- PEERJS CONFIGURATION ---
    let peer = null;
    let myPeerId = null;
    let currentCall = null;
    let localStream = null;

    // DOM Elements
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const callBtn = document.getElementById('call-btn');
    const endCallBtn = document.getElementById('end-call-btn');
    const callModal = document.getElementById('call-modal');
    const remoteVideo = document.getElementById('remote-video');
    const localVideo = document.getElementById('local-video');
    const statusMsg = document.getElementById('status-msg');
    const myPeerIdSpan = document.getElementById('my-peer-id');
    const copyIdBtn = document.getElementById('copy-id-btn');
    const usernameInput = document.getElementById('username-input');

    let currentUser = "";

    // --- INITIALIZATION ---
    
    // Check if user has a username stored
    const savedUser = localStorage.getItem('chat_username');
    if (savedUser) {
        usernameInput.value = savedUser;
        currentUser = savedUser;
        initChat();
    } else {
        usernameInput.focus();
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentUser = usernameInput.value.trim();
                if(currentUser) {
                    localStorage.setItem('chat_username', currentUser);
                    initChat();
                }
            }
        });
    }

    function initChat() {
        // Initialize PeerJS
        // Using a reliable public server for better cross-network connectivity
        peer = new Peer({
            debug: 2,
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });

        peer.on('open', (id) => {
            myPeerId = id;
            myPeerIdSpan.innerText = id;
            console.log('PeerJS connected with ID: ' + id);
            
            // Send online status to Firebase
            db.collection('users').doc(id).set({
                username: currentUser,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                isOnline: true
            }).catch(err => console.error("Error updating online status:", err));
        });

        peer.on('error', (err) => {
            console.error('PeerJS Error:', err);
            addSystemMessage(`Connection error: ${err.type}`);
        });

        // Handle incoming calls
        peer.on('call', (call) => {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then((stream) => {
                    localStream = stream;
                    localVideo.srcObject = stream;
                    localVideo.play();
                    
                    call.answer(stream); // Answer the call with our A/V stream
                    
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream;
                        remoteVideo.play();
                        statusMsg.innerText = "Connected";
                    });

                    call.on('close', () => {
                        endCall();
                    });
                })
                .catch((err) => {
                    console.error('Failed to get local stream', err);
                    alert("Please allow camera/microphone access to make/receive calls.");
                });
        });

        // Listen for chat messages from Firestore
        db.collection('messages').orderBy('timestamp', 'asc').onSnapshot((snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    const data = change.doc.data();
                    renderMessage(data);
                }
            });
        });
    }

    // --- CHAT FUNCTIONS ---

    function renderMessage(data) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');
        
        // Determine if sent or received based on username matching
        if (data.username === currentUser) {
            msgDiv.classList.add('sent');
        } else {
            msgDiv.classList.add('received');
        }

        const nameDiv = document.createElement('div');
        nameDiv.classList.add('sender-name');
        nameDiv.innerText = data.username || 'Anonymous';

        const textDiv = document.createElement('div');
        textDiv.innerText = data.text;

        msgDiv.appendChild(nameDiv);
        msgDiv.appendChild(textDiv);
        messagesDiv.appendChild(msgDiv);
        
        // Scroll to bottom
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addSystemMessage(text) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', 'received');
        msgDiv.style.backgroundColor = '#555';
        msgDiv.style.fontStyle = 'italic';
        msgDiv.innerText = `[System] ${text}`;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;

        // Save to Firestore
        db.collection('messages').add({
            username: currentUser,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).catch((err) => {
            console.error("Error sending message:", err);
            addSystemMessage("Failed to send message. Check connection.");
        });

        msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // --- CALL FUNCTIONS ---

    callBtn.addEventListener('click', () => {
        const targetId = prompt("Enter friend's Peer ID to call:");
        if (!targetId) return;

        if (!peer) {
            alert("Chat not initialized yet. Wait a moment.");
            return;
        }

        statusMsg.innerText = "Calling...";
        callModal.style.display = 'flex';

        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then((stream) => {
                localStream = stream;
                localVideo.srcObject = stream;
                localVideo.play();

                const call = peer.call(targetId, stream);
                
                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.play();
                    statusMsg.innerText = "Connected";
                });

                call.on('close', () => {
                    endCall();
                });

                call.on('error', (err) => {
                    statusMsg.innerText = "Call failed: " + err.type;
                    setTimeout(endCall, 2000);
                });

                currentCall = call;
            })
            .catch((err) => {
                console.error('Error getting media stream:', err);
                alert("Could not access camera/mic.");
                callModal.style.display = 'none';
            });
    });

    function endCall() {
        if (currentCall) {
            currentCall.close();
            currentCall = null;
        }
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        localVideo.srcObject = null;
        remoteVideo.srcObject = null;
        callModal.style.display = 'none';
        statusMsg.innerText = "Call ended";
    }

    endCallBtn.addEventListener('click', endCall);

    // Copy ID functionality
    copyIdBtn.addEventListener('click', () => {
        if(myPeerId) {
            navigator.clipboard.writeText(myPeerId).then(() => {
                const originalText = copyIdBtn.innerText;
                copyIdBtn.innerText = "Copied!";
                setTimeout(() => copyIdBtn.innerText = originalText, 2000);
            });
        }
    });

</script>

</body>
</html>
