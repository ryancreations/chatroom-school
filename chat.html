<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SchoolChat</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- PeerJS for Video Calls -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Emoji Button -->
    <script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.3/dist/index.min.js"></script>
    
    <style>
        /* --- Global & Layout --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #313338;
            color: white;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 260px;
            background-color: #2B2D31;
            border-right: 1px solid #232428;
            display: flex;
            flex-direction: column;
            z-index: 20;
            flex-shrink: 0;
        }

        .sidebar-header {
            height: 50px;
            background-color: #202225;
            border-bottom: 1px solid #232428;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .user-profile {
            padding: 10px 15px;
            background-color: #2B2D31;
            border-bottom: 1px solid #232428;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #5865F2;
            background-size: cover;
            background-position: center;
            margin-right: 10px;
        }

        .username-display {
            font-weight: bold;
            font-size: 14px;
        }

        /* --- Channels Section --- */
        .channels-section {
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .section-header {
            font-size: 12px;
            text-transform: uppercase;
            color: #B9BBBE;
            font-weight: bold;
            margin-bottom: 5px;
            padding-left: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channel-item {
            padding: 8px 10px;
            margin-bottom: 2px;
            border-radius: 4px;
            cursor: pointer;
            color: #B9BBBE;
            display: flex;
            align-items: center;
            font-size: 15px;
            position: relative;
        }

        .channel-item:hover {
            background-color: #35373C;
            color: #DCDDDE;
        }

        .channel-item.active {
            background-color: #3F4147;
            color: white;
        }

        .channel-hash {
            margin-right: 8px;
            color: #72767D;
            font-weight: bold;
        }

        .add-channel-btn {
            background: none;
            border: none;
            color: #B9BBBE;
            cursor: pointer;
            font-size: 18px;
            padding: 0 5px;
        }
        
        .add-channel-btn:hover {
            color: white;
        }

        /* --- Stealth Section --- */
        .stealth-section {
            padding: 10px 15px;
            border-top: 1px solid #232428;
            background-color: #2B2D31;
        }

        .stealth-input-group {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .stealth-input {
            width: 100%;
            background-color: #40444B;
            border: none;
            border-radius: 4px;
            padding: 6px 8px;
            color: white;
            font-size: 12px;
            outline: none;
        }

        .stealth-btn {
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .stealth-btn:hover {
            background-color: #4752C4;
        }

        /* --- Chat Area --- */
        #chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #313338; /* Fallback */
            background-size: cover;
            background-position: center;
        }

        .chat-header {
            height: 50px;
            background-color: #3F4147;
            border-bottom: 1px solid #232428;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 10;
        }

        .chat-title {
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #B9BBBE;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            border-radius: 4px;
        }

        .icon-btn:hover {
            color: white;
            background-color: rgba(255,255,255,0.1);
        }

        /* --- Messages --- */
        #messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 5;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 8px;
            background-color: rgba(64, 68, 75, 0.9);
            backdrop-filter: blur(5px);
            position: relative;
            word-wrap: break-word;
        }

        .message.self {
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.other {
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message-author {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
        }

        .message-time {
            font-size: 10px;
            color: #72767D;
            position: absolute;
            bottom: 5px;
            right: 10px;
        }

        /* Gradient Name Style */
        .gradient-name {
            background: linear-gradient(to right, #ff00cc, #333399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        /* --- Input Area --- */
        .input-area {
            padding: 15px;
            background-color: #313338;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        #msg-input {
            flex-grow: 1;
            background-color: #40444B;
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #msg-input.error {
            border: 2px solid #ED4245;
            color: #ED4245;
        }

        .input-icon-btn {
            background: none;
            border: none;
            color: #B9BBBE;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
        }

        .input-icon-btn:hover {
            color: white;
        }

        /* --- Alerts --- */
        .alert-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .blinker-alert h1 { color: #ED4245; font-size: 4rem; animation: blink 1s infinite; }
        .vape-alert h1 { color: #3BA55C; font-size: 4rem; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* --- Stealth Layer --- */
        #stealth-layer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: white;
            z-index: 10000;
            display: none;
            flex-direction: column;
        }

        #stealth-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .stealth-ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .stealth-top-bar {
            background: #f0f0f0;
            padding: 5px 10px;
            font-size: 12px;
            color: #333;
            display: flex;
            justify-content: space-between;
        }

        .stealth-content {
            color: #333;
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 20px;
        }

        /* --- Mod Tools & Settings --- */
        .modal-panel {
            position: absolute;
            background-color: #2B2D31;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 100;
            display: none;
        }

        #settings-panel {
            top: 60px;
            left: 10px;
            width: 250px;
        }

        #mod-tools-panel {
            top: 60px;
            right: 10px;
            width: 200px;
        }

        .setting-row {
            margin-bottom: 10px;
        }

        .setting-label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #B9BBBE;
        }

        .setting-input {
            width: 100%;
            background: #40444B;
            border: none;
            color: white;
            padding: 8px;
            border-radius: 4px;
        }

        .mod-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background: #40444B;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
        }

        .mod-btn:hover { background: #5865F2; }

        /* Close Button for Panels */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #B9BBBE;
            font-size: 16px;
            cursor: pointer;
            line-height: 1;
        }
        .close-btn:hover { color: white; }

        /* --- Call Overlay --- */
        #video-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #18191C;
            z-index: 500;
            display: none;
            flex-direction: column;
        }

        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #local-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            background: #000;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 510;
        }

        .call-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 520;
        }

        .call-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-hangup { background: #ED4245; color: white; }
        .btn-mute { background: #40444B; color: white; }

        /* --- In-Call Chat Box --- */
        #in-call-chat {
            position: absolute;
            bottom: 80px;
            left: 20px;
            width: 300px;
            height: 200px;
            background: rgba(43, 45, 49, 0.9);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            z-index: 510;
            border: 1px solid #232428;
        }

        #in-call-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 12px;
        }

        .in-call-msg {
            margin-bottom: 5px;
            word-wrap: break-word;
        }

        #in-call-input {
            width: calc(100% - 20px);
            margin: 10px;
            background: #40444B;
            border: none;
            color: white;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        /* --- Modal Overlays (Rules, Channel Create, etc) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #2B2D31;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            position: relative; /* For close button */
        }

        .modal-title {
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2B2D31; }
        ::-webkit-scrollbar-thumb { background: #1A1B1E; border-radius: 4px; }

        /* --- SMOKE EFFECT (FIXED) --- */
        #smoke-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            background: radial-gradient(circle at center, rgba(200,200,200,0.4) 0%, rgba(150,150,150,0.2) 40%, transparent 80%);
            mix-blend-mode: screen;
            filter: blur(20px);
        }

        .smoke-active {
            animation: smokeDiffuse 4s ease-out forwards;
        }

        @keyframes smokeDiffuse {
            0% {
                opacity: 0;
                transform: scale(0.5);
                background: radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, transparent 60%);
            }
            20% {
                opacity: 0.8;
                transform: scale(1.2);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.5);
                background: radial-gradient(circle at center, rgba(200,200,200,0.5) 0%, rgba(100,100,100,0.3) 50%, transparent 80%);
            }
            100% {
                opacity: 0;
                transform: scale(2);
                background: radial-gradient(circle at center, rgba(150,150,150,0.2) 0%, transparent 90%);
            }
        }
    </style>
</head>
<body>

    <!-- Smoke Overlay Element -->
    <div id="smoke-overlay"></div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <span>SchoolChat</span>
        </div>

        <div class="user-profile" onclick="toggleSettings()">
            <div class="avatar" id="sidebar-avatar"></div>
            <div class="username-display" id="sidebar-username">Loading...</div>
        </div>

        <!-- New Stealth Section -->
        <div class="stealth-section">
            <div style="font-size:11px; color:#B9BBBE; margin-bottom:5px; font-weight:bold;">STEALTH MODE</div>
            <div class="stealth-input-group">
                <input type="text" id="stealth-link-input" class="stealth-input" placeholder="Paste URL here...">
            </div>
            <button id="stealth-activate-btn" class="stealth-btn" style="width:100%">Go Stealth</button>
        </div>

        <div class="channels-section">
            <div class="section-header">
                <span>Channels</span>
                <button class="add-channel-btn" onclick="openChannelModal()">+</button>
            </div>
            <div id="channels-container">
                <!-- Channels will be injected here -->
            </div>
        </div>
    </div>

    <!-- Chat Area -->
    <div id="chat-area">
        <div class="chat-header">
            <div class="chat-title">
                <span class="channel-hash">#</span><span id="current-chat-name">general</span>
            </div>
            <div class="header-buttons">
                <button class="icon-btn" id="btn-call" title="Start Call">📞</button>
                <button class="icon-btn" id="btn-blinker" title="Blinker Alert">⚠️</button>
                <!-- Renamed to Vape -->
                <button class="icon-btn" id="btn-vape" title="Vape Break">💨</button>
                <!-- Added Cart Button -->
                <button class="icon-btn" id="btn-cart" title="Cart Break">🛒</button>
                <button class="icon-btn" id="btn-rules" title="View Rules">📜</button>
                <button class="icon-btn" id="btn-mod" title="Mod Tools">🛡️</button>
            </div>
        </div>

        <div id="messages">
            <!-- Messages go here -->
        </div>

        <div class="input-area">
            <!-- File upload removed as requested -->
            <input type="text" id="msg-input" placeholder="Message #general" autocomplete="off" maxlength="1500">
            <button class="input-icon-btn" id="emoji-trigger">😊</button>
        </div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="modal-panel">
        <button class="close-btn" onclick="toggleSettings()">✕</button>
        <div class="setting-row">
            <label class="setting-label">Username</label>
            <input type="text" id="setting-username" class="setting-input">
        </div>
        <div class="setting-row">
            <label class="setting-label">Avatar URL</label>
            <input type="text" id="setting-avatar" class="setting-input">
        </div>
        <div class="setting-row">
            <label class="setting-label">Name Color</label>
            <input type="color" id="setting-color" value="#ffffff">
        </div>
        <div class="setting-row">
            <label class="setting-label">Gradient Name</label>
            <input type="checkbox" id="setting-gradient">
        </div>
        <button class="stealth-btn" onclick="saveSettings()" style="width:100%">Save Changes</button>
    </div>

    <!-- Mod Tools -->
    <div id="mod-tools-panel" class="modal-panel">
        <button class="close-btn" onclick="toggleModTools()">✕</button>
        <button class="mod-btn" onclick="deleteCurrentMessage()">Delete Message</button>
        <button class="mod-btn" onclick="editCurrentMessage()">Edit Message</button>
        <button class="mod-btn" onclick="showRawData()">View Data</button>
        <hr style="border-color: #3F4147; margin: 10px 0;">
        <div style="font-size:12px; color:#B9BBBE; margin-bottom:5px;">Add Moderator (User ID)</div>
        <input type="text" id="new-mod-id" class="setting-input" placeholder="User ID..." style="margin-bottom:5px;">
        <button class="stealth-btn" onclick="addModerator()" style="width:100%; font-size:12px;">Add Mod</button>
    </div>

    <!-- Stealth Layer -->
    <div id="stealth-layer">
        <iframe id="stealth-frame" src=""></iframe>
        <div class="stealth-ui-overlay">
            <div class="stealth-top-bar">
                <span>Google Docs</span>
                <span>File Edit View Insert Format Tools History Help</span>
            </div>
            <div class="stealth-content">
                <h2>Untitled Document</h2>
                <p>Loading your fake homework content...</p>
                <p>Click anywhere to start typing.</p>
            </div>
        </div>
    </div>

    <!-- Call Overlay -->
    <div id="video-overlay">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay muted playsinline></video>
        
        <!-- In-Call Chat Box -->
        <div id="in-call-chat">
            <div id="in-call-messages"></div>
            <input type="text" id="in-call-input" placeholder="Type in call...">
        </div>

        <div class="call-controls">
            <button class="call-btn btn-mute" id="btn-mute-call" onclick="toggleMute()">🎤 Mute</button>
            <button class="call-btn btn-hangup" onclick="endCall()">📞 Hang Up</button>
        </div>
    </div>

    <!-- Call Modal -->
    <div id="call-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="document.getElementById('call-modal').style.display='none'">✕</button>
            <h3 class="modal-title">Video Call</h3>
            <p>Your ID: <span id="my-peer-id">Generating...</span></p>
            <input type="text" id="room-id-input" class="setting-input" placeholder="Enter Friend's ID to Call">
            <button class="stealth-btn" onclick="initiateCall()" style="width:100%; margin-top:10px;">Call</button>
            <div id="active-room-info" style="margin-top:10px; font-size:12px; color:#B9BBBE;"></div>
        </div>
    </div>

    <!-- Rules Modal -->
    <div id="rules-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="document.getElementById('rules-modal').style.display='none'">✕</button>
            <h3 class="modal-title">Server Rules</h3>
            <textarea id="rules-textarea" class="setting-input" rows="10" style="resize: vertical;"></textarea>
            <button class="stealth-btn" onclick="saveRules()" style="width:100%; margin-top:10px;">Save Rules</button>
        </div>
    </div>

    <!-- Emoji Picker Container -->
    <div id="emoji-picker-container" style="position: absolute; bottom: 60px; right: 20px; z-index: 100;"></div>

    <!-- Dev Menu -->
    <div id="dev-menu" style="position: absolute; background: #111; border: 1px solid #00FF00; padding: 10px; display: none; z-index: 3000; color: #00FF00; font-size: 12px;">
        <button onclick="deleteCurrentMessage()" style="background: #00FF00; color: #000; border: none; padding: 5px; margin: 2px;">Delete</button>
        <button onclick="editCurrentMessage()" style="background: #00FF00; color: #000; border: none; padding: 5px; margin: 2px;">Edit</button>
        <button onclick="showRawData()" style="background: #00FF00; color: #000; border: none; padding: 5px; margin: 2px;">Data</button>
    </div>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
            authDomain: "schoolchat-7f5a5.firebaseapp.com",
            databaseURL: "https://schoolchat-7f5a5-default-rtdb.firebaseio.com",
            projectId: "schoolchat-7f5a5",
            storageBucket: "schoolchat-7f5a5.firebasestorage.app",
            messagingSenderId: "752691397853",
            appId: "1:752691397853:web:b4acd05e0259979edfc734",
            measurementId: "G-QS6SVMF7FE"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let currentChatId = "general";
        let peer = null;
        let myStream = null;
        let activeRoomId = null;
        let emojiPicker = null;
        let isMuted = false;

        // --- Initialization ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loadUserProfile();
                renderFriends();
                initEmojiPicker();
                checkForAlerts();
                setupDevMode();
                loadChannels();
            } else {
                window.location.href = "index.html";
            }
        });

        // --- User Profile ---
        function loadUserProfile() {
            db.collection("users").doc(currentUser.uid).onSnapshot((doc) => {
                if (!doc.exists) return;
                const data = doc.data();
                
                document.getElementById('sidebar-username').textContent = data.username || "User";
                document.getElementById('setting-username').value = data.username || "";
                document.getElementById('setting-avatar').value = data.photoURL || "";
                document.getElementById('setting-color').value = data.nameColor || "#FFFFFF";
                document.getElementById('setting-gradient').checked = data.gradientEnabled || false;
                
                const avatarEl = document.getElementById('sidebar-avatar');
                if (data.photoURL) {
                    avatarEl.style.backgroundImage = `url(${data.photoURL})`;
                } else {
                    avatarEl.style.backgroundImage = 'none';
                }

                // Apply custom background
                if (data.customBackground) {
                    document.getElementById('chat-area').style.backgroundImage = `url(${data.customBackground})`;
                } else {
                    document.getElementById('chat-area').style.backgroundImage = 'none';
                }
            });
        }

        function saveSettings() {
            const username = document.getElementById('setting-username').value.trim();
            const avatar = document.getElementById('setting-avatar').value.trim();
            const color = document.getElementById('setting-color').value;
            const gradient = document.getElementById('setting-gradient').checked;

            db.collection("users").doc(currentUser.uid).update({
                username: username,
                photoURL: avatar,
                nameColor: color,
                gradientEnabled: gradient
            }).then(() => {
                toggleSettings();
            });
        }

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        // --- Channels & Friends ---
        function loadChannels() {
            // Listen for friends list to populate sidebar
            db.collection("users").doc(currentUser.uid).get().then((doc) => {
                const friends = doc.data()?.friends || [];
                const container = document.getElementById('channels-container');
                container.innerHTML = '';

                // Add General Channel
                addChannelItem(container, 'general', true);

                // Add Friend Channels
                friends.forEach(friendId => {
                    db.collection("users").doc(friendId).get().then(doc => {
                        if(doc.exists) {
                            const friendData = doc.data();
                            addChannelItem(container, friendData.username, false, friendId);
                        }
                    });
                });
            });
        }

        function addChannelItem(container, name, isGeneral = false, userId = null) {
            const div = document.createElement('div');
            div.className = 'channel-item';
            div.innerHTML = `<span class="channel-hash">#</span> ${name}`;
            div.onclick = () => switchChat(name, userId);
            container.appendChild(div);
        }

        function switchChat(channelName, userId = null) {
            currentChatId = channelName;
            document.getElementById('current-chat-name').textContent = channelName;
            document.getElementById('msg-input').placeholder = `Message #${channelName}`;
            
            // Highlight active
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            listenToMessages();
        }

        function openChannelModal() {
            const name = prompt("Enter new channel name:");
            if (name) {
                // In a real app, you'd create a channel doc here
                alert(`Channel #${name} created! (Simulated)`);
                loadChannels();
            }
        }

        // --- Messaging ---
        function listenToMessages() {
            const messagesContainer = document.getElementById('messages');
            messagesContainer.innerHTML = ''; // Clear existing

            db.collection("chats").doc(currentChatId).collection("messages")
                .orderBy("timestamp", "asc")
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            const msg = change.doc.data();
                            renderMessage(msg);
                        }
                    });
                    scrollToBottom();
                });
        }

        function renderMessage(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            const isSelf = msg.senderId === currentUser.uid;
            
            div.className = `message ${isSelf ? 'self' : 'other'}`;
            
            // Check for link embed
            let textContent = msg.text;
            let embedHtml = '';
            if (msg.text && /^https?:\/\//i.test(msg.text)) {
                embedHtml = `<div class="link-embed" style="margin-top:5px; padding:10px; background:#2B2D31; border-left:4px solid #5865F2; border-radius:4px;">
                    <a href="${msg.text}" target="_blank" style="color:#5865F2; text-decoration:none; font-size:12px;">${msg.text}</a>
                </div>`;
                textContent = msg.text.replace(/^https?:\/\//i, ''); // Remove url from main text if desired, or keep it
            }

            const timeStr = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
            
            // Name styling
            let nameStyle = `color: ${msg.nameColor || '#FFFFFF'}`;
            if (msg.gradientEnabled) {
                nameStyle += '; background: linear-gradient(to right, #ff00cc, #333399); -webkit-background-clip: text; -webkit-text-fill-color: transparent;';
            }

            div.innerHTML = `
                <div class="message-author" style="${nameStyle}">${msg.username}</div>
                <div class="message-text">${textContent}</div>
                ${embedHtml}
                <div class="message-time">${timeStr}</div>
            `;
            
            // Store ID for mod tools
            div.dataset.id = change.doc.id;
            container.appendChild(div);
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            
            if (!text) return;

            // Validation: Max 1500 chars
            if (text.length > 1500) {
                input.classList.add('error');
                setTimeout(() => input.classList.remove('error'), 1000);
                return;
            }

            const messageData = {
                senderId: currentUser.uid,
                username: currentUser.displayName || "User",
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                nameColor: "#FFFFFF", // Default, can be pulled from profile later
                gradientEnabled: false
            };

            db.collection("chats").doc(currentChatId).collection("messages").add(messageData)
                .then(() => {
                    input.value = '';
                    input.classList.remove('error');
                })
                .catch((err) => console.error("Error sending message:", err));
        }

        // --- FIXED INPUT LOGIC ---
        const msgInput = document.getElementById('msg-input');
        
        // Explicitly bind keydown to ensure only Enter triggers send
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); // Prevent newline
                sendMessage();
            }
            // Allow Shift+Enter for newline (default behavior)
        });

        // Visual feedback for length
        msgInput.addEventListener('input', () => {
            if (msgInput.value.length > 1500) {
                msgInput.classList.add('error');
            } else {
                msgInput.classList.remove('error');
            }
        });

        function scrollToBottom() {
            const messagesContainer = document.getElementById('messages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // --- Alerts & Smoke ---
        function triggerAlert(type) {
            // Trigger Smoke Effect first
            showSmokeEffect();

            // Then trigger the alert in Firestore
            db.collection("alerts").add({
                type: type,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Update Counter for Offline/Online viewing
            updateAlertCounter(type);
        }

        function showSmokeEffect() {
            const smoke = document.getElementById('smoke-overlay');
            // Reset animation by removing and re-adding class
            smoke.classList.remove('smoke-active');
            void smoke.offsetWidth; // trigger reflow
            smoke.classList.add('smoke-active');
        }

        function updateAlertCounter(type) {
            // Get or create counter doc for this chat
            const counterRef = db.collection("counters").doc(currentChatId);
            
            counterRef.get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    const currentCount = data[type] || 0;
                    counterRef.update({ [type]: currentCount + 1 });
                } else {
                    counterRef.set({ [type]: 1 });
                }
            });
        }

        function checkForAlerts() {
            db.collection("alerts").orderBy("timestamp", "desc").limit(1).onSnapshot((snapshot) => {
                if (!snapshot.empty) {
                    const alert = snapshot.docs[0].data();
                    const fiveSecondsAgo = new Date(Date.now() - 5000);
                    
                    if (alert.timestamp && alert.timestamp.toDate() > fiveSecondsAgo) {
                        showOverlay(alert.type);
                    }
                }
            });
            
            // Load last counts for display
            loadAlertCounts();
        }

        function loadAlertCounts() {
            db.collection("counters").doc(currentChatId).onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    // Display counts somewhere? Maybe in header or tooltip?
                    // For now, let's just log it or we can add a small indicator in the header
                    console.log(`Vapes: ${data.vape || 0}, Carts: ${data.cart || 0}`);
                }
            });
        }

        function showOverlay(type) {
            const overlay = document.createElement('div');
            overlay.className = `alert-overlay ${type}-alert`;
            overlay.innerHTML = `<h1>${type === 'blinker' ? 'BLINKER ALERT!' : type === 'vape' ? 'VAPE BREAK!' : 'CART BREAK!'}</h1>`;
            document.body.appendChild(overlay);
            overlay.style.display = 'flex';
            
            setTimeout(() => {
                overlay.style.display = 'none';
                overlay.remove();
            }, 3000);
        }

    // --- Event Listeners for Buttons ---
    document.getElementById('btn-blinker').addEventListener('click', () => triggerAlert('blinker'));
    document.getElementById('btn-vape').addEventListener('click', () => triggerAlert('vape'));
    document.getElementById('btn-cart').addEventListener('click', () => triggerAlert('cart'));

        // --- Stealth Mode ---
        const stealthLayer = document.getElementById('stealth-layer');
        const stealthFrame = document.getElementById('stealth-frame');
        
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.code === 'CapsLock') {
                e.preventDefault();
                const isHidden = stealthLayer.style.display === 'none' || stealthLayer.style.display === '';
                stealthLayer.style.display = isHidden ? 'flex' : 'none';
                if (isHidden) {
                    const url = document.getElementById('stealth-link-input').value || 'https://www.youtube.com/embed/dQw4w9WgXcQ';
                    stealthFrame.src = url;
                } else {
                    stealthFrame.src = '';
                }
            }
        });

        document.getElementById('stealth-activate-btn').addEventListener('click', () => {
             const url = document.getElementById('stealth-link-input').value || 'https://www.youtube.com/embed/dQw4w9WgXcQ';
             stealthFrame.src = url;
             stealthLayer.style.display = 'flex';
        });

        // --- Emoji Picker ---
        function initEmojiPicker() {
            const pickerButton = document.getElementById('emoji-trigger');
            const container = document.getElementById('emoji-picker-container');
            
            emojiPicker = new EmojiButton({
                theme: 'auto',
                autoSelect: false,
                initIn: ['footer']
            });

            pickerButton.addEventListener('click', async () => {
                try {
                    await emojiPicker.togglePicker(container);
                } catch (err) {
                    console.log(err);
                }
            });

            emojiPicker.on('emoji', selection => {
                const input = document.getElementById('msg-input');
                const start = input.selectionStart;
                const end = input.selectionEnd;
                input.value = input.value.substring(0, start) + selection.emoji + input.value.substring(end);
                input.focus();
            });
        }

        // --- File Upload (Simple Placeholder) ---
        function handleFileUpload(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                // In a real app, upload to Firebase Storage and get URL
                // For now, just send filename as text
                document.getElementById('msg-input').value = `[File: ${file.name}]`;
            }
        }

        // --- Video Calls (PeerJS) ---
        function openCallModal() {
            document.getElementById('call-modal').style.display = 'flex';
            if (!peer) {
                initPeer();
            }
        }

        function initPeer() {
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('my-peer-id').innerText = id;
            });

            peer.on('call', (call) => {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
                    myStream = stream;
                    call.answer(stream);
                    const remoteVideo = document.getElementById('remote-video');
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream;
                        document.getElementById('video-overlay').style.display = 'flex';
                    });
                });
            });
        }

        function initiateCall() {
            const targetId = document.getElementById('room-id-input').value.trim();
            if (!targetId) {
                alert("Please enter a friend's ID.");
                return;
            }

            // Ensure peer is initialized
            if (!peer) initPeer();

            // Wait for peer ID to be ready
            if (peer.id === '') {
                peer.once('open', () => connectToUser(targetId));
            } else {
                connectToUser(targetId);
            }
        }

        function connectToUser(targetId) {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
                myStream = stream;
                document.getElementById('local-video').srcObject = stream;
                
                const call = peer.call(targetId, stream);
                const remoteVideo = document.getElementById('remote-video');
                
                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    document.getElementById('video-overlay').style.display = 'flex';
                });

                call.on('close', () => {
                    endCall();
                });
            }).catch(err => {
                console.error("Failed to get local stream", err);
                alert("Could not access camera/microphone.");
            });
        }

        function endCall() {
            document.getElementById('video-overlay').style.display = 'none';
            if (myStream) {
                myStream.getTracks().forEach(track => track.stop());
            }
            if (peer) {
                peer.disconnect();
                peer = null;
            }
            // Clear inputs
            document.getElementById('local-video').srcObject = null;
            document.getElementById('remote-video').srcObject = null;
        }

        function toggleMute() {
            if (myStream) {
                const audioTrack = myStream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled;
                isMuted = !audioTrack.enabled;
                document.getElementById('btn-mute-call').innerText = isMuted ? "🔇 Unmute" : "🎤 Mute";
            }
        }

        // --- In-Call Chat Logic ---
        const inCallInput = document.getElementById('in-call-input');
        const inCallMessages = document.getElementById('in-call-messages');

        inCallInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const text = inCallInput.value.trim();
                if (text) {
                    // Send to main chat
                    const messageData = {
                        senderId: currentUser.uid,
                        username: currentUser.displayName || "User",
                        text: text,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        nameColor: "#FFFFFF",
                        gradientEnabled: false
                    };
                    db.collection("chats").doc(currentChatId).collection("messages").add(messageData);
                    
                    // Also add locally for immediate feedback
                    addLocalInCallMessage(text);
                    inCallInput.value = '';
                }
            }
        });

        function addLocalInCallMessage(text) {
            const div = document.createElement('div');
            div.className = 'in-call-msg';
            div.textContent = text;
            inCallMessages.appendChild(div);
            inCallMessages.scrollTop = inCallMessages.scrollHeight;
        }

        // --- Mod Tools ---
        function toggleModTools() {
            const panel = document.getElementById('mod-tools-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        let currentMsgId = null;

        function setupDevMode() {
            document.addEventListener('click', (e) => {
                if (e.shiftKey) {
                    const msgDiv = e.target.closest('.message');
                    if (msgDiv) {
                        currentMsgId = msgDiv.dataset.id;
                        const devMenu = document.getElementById('dev-menu');
                        devMenu.style.display = 'block';
                        devMenu.style.left = `${e.clientX}px`;
                        devMenu.style.top = `${e.clientY}px`;
                    } else {
                        document.getElementById('dev-menu').style.display = 'none';
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'Enter') {
                    document.getElementById('dev-menu').style.display = 'none';
                }
            });
        }

        function deleteCurrentMessage() {
            if (currentMsgId) {
                db.collection("chats").doc(currentChatId).collection("messages").doc(currentMsgId).delete();
                document.getElementById('dev-menu').style.display = 'none';
            }
        }

        function editCurrentMessage() {
            if (currentMsgId) {
                const newText = prompt("Edit message:");
                if (newText !== null) {
                    db.collection("chats").doc(currentChatId).collection("messages").doc(currentMsgId).update({
                        text: newText
                    });
                    document.getElementById('dev-menu').style.display = 'none';
                }
            }
        }

        function showRawData() {
            if (currentMsgId) {
                db.collection("chats").doc(currentChatId).collection("messages").doc(currentMsgId).get().then(doc => {
                    alert(JSON.stringify(doc.data(), null, 2));
                });
                document.getElementById('dev-menu').style.display = 'none';
            }
        }

        // --- Rules ---
        function openRulesModal() {
            document.getElementById('rules-modal').style.display = 'flex';
            db.collection("chats").doc(currentChatId).get().then(doc => {
                if (doc.exists) {
                    document.getElementById('rules-textarea').value = doc.data().rules || "No rules set.";
                } else {
                    document.getElementById('rules-textarea').value = "Default Rule 1: Be cool.\nDefault Rule 2: No spam.";
                }
            });
        }

        function saveRules() {
            const rules = document.getElementById('rules-textarea').value;
            db.collection("chats").doc(currentChatId).set({
                rules: rules
            }, { merge: true });
            document.getElementById('rules-modal').style.display = 'none';
        }

        // --- Logout ---
        function logout() {
            updateStatus(false);
            auth.signOut().then(() => {
                window.location.href = "index.html";
            });
        }

        function updateStatus(isOnline) {
            if(currentUser) {
                db.collection("users").doc(currentUser.uid).update({
                    status: isOnline ? "online" : "offline",
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }

        window.addEventListener('beforeunload', () => updateStatus(false));
    </script>
