<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolChat + Feed</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Emoji Picker -->
    <script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.3/dist/index.min.js"></script>

    <style>
        /* --- BASE STYLES --- */
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #1e1f22; color: white; overflow: hidden; }
        
        /* --- SIDEBAR --- */
        #sidebar { width: 260px; background: #2b2d31; display: flex; flex-direction: column; border-right: 1px solid #17191c; z-index: 20; position: relative; }
        .header { padding: 15px; font-weight: bold; background: #202225; border-bottom: 1px solid #17191c; display: flex; justify-content: space-between; align-items: center; }
        .friend-list { flex: 1; overflow-y: auto; padding: 10px; }
        .friend-item { padding: 10px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; margin-bottom: 2px; position: relative; }
        .friend-item:hover { background: #35373c; }
        .avatar { width: 32px; height: 32px; background: #5865f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; overflow: hidden; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* --- CHAT AREA --- */
        #chat-area { flex: 1; display: flex; flex-direction: column; position: relative; background: #1e1f22; }
        .chat-header { height: 50px; border-bottom: 1px solid #17191c; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: #2b2d31; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Chat Messages */
        .message { max-width: 70%; padding: 10px 15px; border-radius: 18px; word-wrap: break-word; background: #40444b; position: relative; }
        .msg-self { align-self: flex-end; background: #005c4b; border-bottom-right-radius: 4px; }
        .msg-other { align-self: flex-start; background: #40444b; border-bottom-left-radius: 4px; }

        /* --- FEED STYLES (NEW) --- */
        #feed-container { 
            display: none; /* Hidden by default, toggled via JS */
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            background: #1e1f22;
            padding-bottom: 100px;
        }

        .post-card {
            background: #2b2d31;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: 1px solid #3f4044;
            position: relative;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .post-user-info { display: flex; align-items: center; gap: 10px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .post-username { font-weight: bold; font-size: 15px; }
        .post-date { font-size: 11px; color: #b9bbbe; text-align: right; }

        .mood-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 10px;
            background: #3f4044;
            color: #b9bbbe;
        }
        .mood-depressed { background: #5865f2; color: white; }
        .mood-faded { background: #99aab5; color: black; }
        .mood-suicidal { background: #ed4245; color: white; }
        .mood-67 { background: #3ba55c; color: black; }
        .mood-rant { background: #faa61a; color: black; }

        .post-body { font-size: 15px; line-height: 1.4; margin-bottom: 10px; word-break: break-word; }
        .post-media img { max-width: 100%; border-radius: 8px; margin-top: 10px; max-height: 500px; object-fit: contain; background: #000; }
        .post-media iframe { width: 100%; height: 315px; border: none; border-radius: 8px; }

        .post-footer {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #3f4044;
        }
        .reaction-btn {
            background: none;
            border: none;
            color: #b9bbbe;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }
        .reaction-btn.active { color: #ff4757; }

        /* --- NAV BAR --- */
        .nav-bar {
            background: #202225;
            padding: 10px 20px;
            border-bottom: 1px solid #17191c;
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid #5865f2;
            color: #5865f2;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-btn:hover { background: #5865f2; color: white; }
        .nav-btn.active { background: #5865f2; color: white; }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #2b2d31;
            width: 500px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; font-size: 18px; }
        .close-modal { cursor: pointer; font-size: 20px; }
        
        .create-post-input {
            width: 95%;
            min-height: 100px;
            background: #40444b;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: 15px;
        }
        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .mood-select {
            background: #40444b;
            color: white;
            border: none;
            padding: 5px;
            border-radius: 4px;
        }
        .submit-post-btn {
            background: #5865f2;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- STEALTH MODE --- */
        #stealth-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: white; z-index: 10000; display: none; overflow: hidden;
        }
        #stealth-video { width: 100%; height: 100%; object-fit: cover; }
        #stealth-ui {
            position: absolute; bottom: 20px; left: 20px; color: black; 
            font-family: serif; font-size: 14px; pointer-events: none;
        }

        /* EMOJI PICKER */
        #emoji-picker { position: absolute; bottom: 60px; left: 20px; z-index: 10; }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="header">
        <span>SchoolChat</span>
        <button onclick="toggleStealthUI()" style="background:none; border:none; cursor:pointer; font-size:16px;">👁️ Stealth</button>
    </div>
    
    <div style="padding: 10px; border-bottom: 1px solid #17191c;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="avatar" id="my-avatar-sidebar"></div>
            <span id="my-username-display" style="font-weight: bold;">Loading...</span>
        </div>
    </div>

    <div class="friend-list" id="friends-container">
        <!-- Friends injected here -->
    </div>
</div>

<!-- MAIN CONTENT WRAPPER -->
<div id="main-wrapper" style="flex:1; display:flex; flex-direction:column;">
    
    <!-- NAV BAR -->
    <div class="nav-bar">
        <button class="nav-btn active" id="btn-chat" onclick="switchView('chat')">💬 Chat</button>
        <button class="nav-btn" id="btn-feed" onclick="switchView('feed')">📰 Feed</button>
        <button class="nav-btn" style="margin-left:auto;" onclick="openCreatePostModal()">+ Create Post</button>
    </div>

    <!-- CHAT VIEW -->
    <div id="chat-view" style="display:flex; flex-direction:column; height:100%;">
        <div class="chat-header">
            <span id="current-chat-name"># General</span>
            <div style="display:flex; gap:10px;">
                <button class="nav-btn" onclick="alert('Call feature coming soon!')">📞 Call</button>
            </div>
        </div>
        
        <div id="messages">
            <!-- Chat messages go here -->
        </div>

        <div style="padding:10px; background:#2b2d31; display:flex; gap:10px;">
            <input type="text" id="msg-input" placeholder="Type a message..." style="flex:1; padding:10px; border-radius:20px; border:none; background:#40444b; color:white; outline:none;">
            <button class="nav-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- FEED VIEW -->
    <div id="feed-container">
        <!-- Posts go here -->
    </div>

</div>

<!-- CREATE POST MODAL -->
<div id="create-post-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span>Create Post</span>
            <span class="close-modal" onclick="closeModal()">&times;</span>
        </div>
        <textarea id="post-textarea" class="create-post-input" placeholder="What's on your mind?"></textarea>
        
        <div class="post-actions">
            <select id="post-mood" class="mood-select">
                <option value="General">General</option>
                <option value="Faded">Faded</option>
                <option value="Depressed">Depressed</option>
                <option value="Suicidal">Suicidal</option>
                <option value="67">67</option>
                <option value="Rant">Rant</option>
            </select>
            <button class="submit-post-btn" onclick="submitPost()">Post</button>
        </div>
    </div>
</div>

<!-- STEALTH LAYER -->
<div id="stealth-layer">
    <iframe id="stealth-video" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1" frameborder="0" allowfullscreen></iframe>
    <div id="stealth-ui">
        <strong>Mr. Anderson's Math Class</strong><br>
        Calculus: Derivatives<br>
        Chapter 4, Page 120
    </div>
</div>

<script>
    // --- CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
        authDomain: "schoolchat-7f5a5.firebaseapp.com",
        projectId: "schoolchat-7f5a5",
        storageBucket: "schoolchat-7f5a5.firebasestorage.app",
        messagingSenderId: "752691397853",
        appId: "1:752691397853:web:b4acd05e0259979edfc734"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentChatId = "general";

    // --- AUTH & INIT ---
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('my-username-display').innerText = user.email.split('@')[0];
            loadUserData();
            listenToMessages();
            listenToFeed();
            initEmojiPicker();
        } else {
            window.location.href = "index.html"; // Or wherever your login is
        }
    });

    function loadUserData() {
        // Basic profile loading logic
        db.collection("users").doc(currentUser.uid).onSnapshot(doc => {
            const data = doc.data();
            if(data) {
                document.getElementById('my-username-display').innerText = data.username || currentUser.email.split('@')[0];
            }
        });
    }

    // --- VIEW SWITCHING ---
    function switchView(viewName) {
        const chatView = document.getElementById('chat-view');
        const feedView = document.getElementById('feed-container');
        const btnChat = document.getElementById('btn-chat');
        const btnFeed = document.getElementById('btn-feed');

        if (viewName === 'chat') {
            chatView.style.display = 'flex';
            feedView.style.display = 'none';
            btnChat.classList.add('active');
            btnFeed.classList.remove('active');
        } else {
            chatView.style.display = 'none';
            feedView.style.display = 'block';
            btnChat.classList.remove('active');
            btnFeed.classList.add('active');
        }
    }

    // --- CHAT FUNCTIONALITY (FIXED) ---
    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        // 1. Add to Firestore
        db.collection("chats").doc(currentChatId).collection("messages").add({
            senderId: currentUser.uid,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            chatId: currentChatId
        });

        // 2. Immediate Local Update (Fixes the "it doesn't send" visual lag)
        appendMessageToDOM(currentUser.uid, text, true);
        input.value = "";
    }

    function appendMessageToDOM(uid, text, isSelf) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `message ${isSelf ? 'msg-self' : 'msg-other'}`;
        div.innerHTML = `<div>${escapeHtml(text)}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function listenToMessages() {
        db.collection("chats").doc(currentChatId).collection("messages")
            .orderBy("timestamp", "asc")
            .onSnapshot(snapshot => {
                const container = document.getElementById('messages');
                // Only clear if we want to force refresh, otherwise append new ones
                // For simplicity in this fix, we re-render all (fine for small chats)
                container.innerHTML = ""; 
                
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const isMe = msg.senderId === currentUser.uid;
                    appendMessageToDOM(msg.senderId, msg.text, isMe);
                });
            });
    }

    // --- FEED FUNCTIONALITY ---
    function openCreatePostModal() {
        document.getElementById('create-post-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('create-post-modal').style.display = 'none';
    }

    function submitPost() {
        const text = document.getElementById('post-textarea').value.trim();
        const mood = document.getElementById('post-mood').value;
        
        if (!text) return;

        // Determine media
        let mediaHtml = "";
        const ytRegex = /^(?:https?:\/\/)?(?:www\.)?(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/;
        const match = text.match(ytRegex);
        
        if (match && match[1]) {
            mediaHtml = `<div class="post-media"><iframe src="https://www.youtube.com/embed/${match[1]}"></iframe></div>`;
        } else if (text.startsWith('http') && (text.endsWith('.jpg') || text.endsWith('.png') || text.endsWith('.gif'))) {
            mediaHtml = `<div class="post-media"><img src="${text}" alt="Post Image"></div>`;
        }

        db.collection("posts").add({
            userId: currentUser.uid,
            username: currentUser.email.split('@')[0],
            text: text,
            mood: mood,
            mediaHtml: mediaHtml,
            likes: {}, // Store liked users here: { uid: true }
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('post-textarea').value = "";
        closeModal();
    }

    function listenToFeed() {
        db.collection("posts").orderBy("timestamp", "desc").limit(50).onSnapshot(snapshot => {
            const container = document.getElementById('feed-container');
            container.innerHTML = "";

            snapshot.forEach(doc => {
                const post = doc.data();
                const date = post.timestamp ? new Date(post.timestamp.toMillis()).toLocaleString() : "Just now";
                
                // Mood Class
                let moodClass = '';
                if(post.mood === 'Depressed') moodClass = 'mood-depressed';
                else if(post.mood === 'Faded') moodClass = 'mood-faded';
                else if(post.mood === 'Suicidal') moodClass = 'mood-suicidal';
                else if(post.mood === '67') moodClass = 'mood-67';
                else if(post.mood === 'Rant') moodClass = 'mood-rant';

                // Check if current user liked it
                const hasLiked = post.likes && post.likes[currentUser.uid];

                const html = `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-user-info">
                                <div class="avatar">${post.username[0].toUpperCase()}</div>
                                <span class="post-username">${escapeHtml(post.username)}</span>
                            </div>
                            <span class="post-date">${date}</span>
                        </div>
                        
                        ${post.mood !== 'General' ? `<div class="mood-tag ${moodClass}">${post.mood}</div>` : ''}
                        
                        <div class="post-body">${escapeHtml(post.text)}</div>
                        ${post.mediaHtml}
                        
                        <div class="post-footer">
                            <button class="reaction-btn ${hasLiked ? 'active' : ''}" onclick="toggleLike('${doc.id}', ${hasLiked})">
                                ❤️ ${Object.keys(post.likes || {}).length} Likes
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        });
    }

    function toggleLike(postId, currentlyLiked) {
        const postRef = db.collection("posts").doc(postId);
        
        if (currentlyLiked) {
            postRef.update({
                [`likes.${currentUser.uid}`]: firebase.firestore.FieldValue.delete()
            });
        } else {
            postRef.update({
                [`likes.${currentUser.uid}`]: true
            });
        }
    }

    // --- UTILS ---
    function escapeHtml(text) {
        if(!text) return "";
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function toggleStealthUI() {
        const layer = document.getElementById('stealth-layer');
        layer.style.display = layer.style.display === 'none' || layer.style.display === '' ? 'block' : 'none';
    }

    function initEmojiPicker() {
        // Simple emoji implementation
        const picker = new EmojiButton();
        const trigger = document.querySelector('#emoji-trigger'); // Assuming you add an emoji button
        // Note: You'd need to add an emoji button to your HTML for this to work perfectly
    }

    // Listen for Shift+CapsLock for Stealth
    document.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.code === 'CapsLock') {
            toggleStealthUI();
        }
    });

</script>
</body>
</html>
