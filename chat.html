<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SchoolChat</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- PeerJS for Video Calls -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Emoji Picker -->
    <script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.3/dist/index.min.js"></script>

    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #313338; color: white; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 260px; background: #2B2D31; display: flex; flex-direction: column; border-right: 1px solid #232428; transition: transform 0.3s; }
        .header { padding: 15px; font-weight: bold; background: #202225; border-bottom: 1px solid #232428; display: flex; justify-content: space-between; align-items: center; }
        .friend-list { flex: 1; overflow-y: auto; padding: 10px; }
        .friend-item { padding: 10px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; margin-bottom: 2px; position: relative; }
        .friend-item:hover { background: #35373C; }
        .friend-item.active { background: #3F4147; }
        .status-dot { width: 8px; height: 8px; background: #747F8D; border-radius: 50%; position: absolute; bottom: 10px; right: 10px; border: 2px solid #35373C; }
        .friend-item.active .status-dot { border-color: #3F4147; }
        .online .status-dot { background: #3BA55C; }
        
        .avatar { width: 32px; height: 32px; background: #5865F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .add-friend-section { padding: 10px; border-top: 1px solid #232428; }
        input[type="text"], input[type="file"] { width: 90%; padding: 8px; border-radius: 4px; border: none; background: #40444B; color: white; margin-bottom: 5px; }
        
        /* Chat Area */
        #chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { height: 50px; border-bottom: 1px solid #232428; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: #2B2D31; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 70%; padding: 10px 15px; border-radius: 18px; word-wrap: break-word; background: #40444B; }
        .msg-self { align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-other { align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-sender { font-size: 11px; color: #b9bbbe; margin-bottom: 4px; font-weight: bold; }
        .input-area { padding: 10px; background: #313338; display: flex; align-items: center; gap: 10px; }
        .input-wrapper { flex: 1; background: #40444B; border-radius: 8px; padding: 5px; display: flex; align-items: center; position: relative; }
        #msg-input { background: transparent; border: none; color: white; flex: 1; outline: none; padding: 10px; }
        .call-btn { background: #5865F2; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .icon-btn { background: transparent; border: none; color: #b9bbbe; cursor: pointer; padding: 5px; font-size: 20px; }
        .icon-btn:hover { color: white; }
        
        /* Video Overlay */
        #video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #18191C; z-index: 100; display: none; flex-direction: column; }
        #remote-video-container { flex: 1; display: flex; justify-content: center; align-items: center; background: black; }
        #my-video { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 150px; background: #333; border-radius: 8px; border: 2px solid #5865F2; object-fit: cover; }
        .video-controls { padding: 20px; display: flex; justify-content: center; gap: 20px; background: #202225; }
        .control-btn { padding: 10px 20px; background: #ED4245; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .control-btn.green { background: #3BA55C; }
        
        /* Helpers */
        img.gif, img.image-msg { max-width: 200px; border-radius: 8px; margin-top: 5px; }
        #emoji-picker { position: absolute; bottom: 60px; left: 20px; z-index: 10; }
        
        /* Stealth Mode */
        .stealth-mode { filter: grayscale(100%); }
        #stealth-toggle { background: #40444B; border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="header">
        <span>SchoolChat</span>
        <button id="stealth-toggle" onclick="toggleStealth()">👁️ Stealth</button>
    </div>
    <div class="friend-list" id="friends-container">
        <!-- Friends injected here -->
    </div>
    <div class="add-friend-section">
        <input type="text" id="friend-email" placeholder="Friend's Email or ID...">
        <button onclick="addFriend()" style="background:#5865F2; color:white; border:none; width:100%; padding:8px; border-radius:4px; cursor:pointer;">+ Add Friend</button>
    </div>
    <div style="padding: 10px; border-top: 1px solid #232428;">
        <button onclick="logout()" style="background:transparent; color:red; border:none; cursor:pointer; width:100%;">Log Out</button>
    </div>
</div>

<!-- MAIN CHAT -->
<div id="chat-area">
    <div class="chat-header">
        <span id="current-chat-name"># General</span>
        <button class="call-btn" onclick="startCall()">📞 Call</button>
    </div>
    <div id="messages"></div>
    <div class="input-area">
        <button class="icon-btn" onclick="document.getElementById('image-upload').click()">📷</button>
        <input type="file" id="image-upload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        <div class="input-wrapper">
            <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="icon-btn" id="emoji-trigger">😊</button>
        </div>
    </div>
</div>

<!-- VIDEO CALL OVERLAY -->
<div id="video-overlay">
    <div id="remote-video-container">
        <video id="remote-video" autoplay playsinline style="max-width:100%; max-height:100%;"></video>
    </div>
    <video id="my-video" autoplay playsinline muted></video>
    <div class="video-controls">
        <button class="control-btn green" onclick="toggleMute()">🎤 Mute</button>
        <button class="control-btn" onclick="endCall()">📞 Hang Up</button>
    </div>
</div>

<!-- EMOJI PICKER -->
<div id="emoji-picker"></div>

<script>
   // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
  authDomain: "schoolchat-7f5a5.firebaseapp.com",
  databaseURL: "https://schoolchat-7f5a5-default-rtdb.firebaseio.com",
  projectId: "schoolchat-7f5a5",
  storageBucket: "schoolchat-7f5a5.firebasestorage.app",
  messagingSenderId: "752691397853",
  appId: "1:752691397853:web:b4acd05e0259979edfc734",
  measurementId: "G-QS6SVMF7FE"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentChatId = "general"; 
    let peer = null;
    let myStream = null;
    let currentCallPeer = null;
    let activityTimer;
    let isStealth = false;

    // AUTH CHECK
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            loadUserData();
            renderFriends();
            listenToMessages();
            initEmojiPicker();
            resetInactivityTimer();
        } else {
            window.location.href = "index.html";
        }
    });

    function loadUserData() {
        db.collection("users").doc(currentUser.uid).onSnapshot(doc => {
            const data = doc.data();
            document.getElementById('user-display').innerText = data.username || currentUser.email.split('@')[0];
        });
    }

    // INACTIVITY TIMER (For School Computers)
    function resetInactivityTimer() {
        clearTimeout(activityTimer);
        activityTimer = setTimeout(() => {
            logout();
        }, 5 * 60 * 1000); // 5 minutes
    }
    ['mousemove', 'mousedown', 'keypress'].forEach(evt => 
        document.addEventListener(evt, resetInactivityTimer)
    );

    // FRIENDS LOGIC
    function addFriend() {
        const target = document.getElementById('friend-email').value.trim();
        if(!target) return;
        
        db.collection("users").where("email", "==", target).get().then(snap => {
            if(snap.empty) {
                 db.collection("users").where("username", "==", target.toLowerCase()).get().then(snap2 => {
                     if(snap2.empty) return alert("User not found");
                     addToFriendList(snap2.docs[0].id, snap2.docs[0].data().username);
                 });
            } else {
                addToFriendList(snap.docs[0].id, snap.docs[0].data().username);
            }
        });
    }

    function addToFriendList(uid, name) {
        if(uid === currentUser.uid) return;
        const ref = db.collection("users").doc(currentUser.uid).collection("friends").doc(uid);
        ref.set({ name: name, uid: uid }, { merge: true }).then(() => renderFriends());
    }

    function renderFriends() {
        const container = document.getElementById('friends-container');
        container.innerHTML = `<div class="friend-item active" onclick="switchChat('general')">💬 General Chat</div>`;
        
        db.collection("users").doc(currentUser.uid).collection("friends").onSnapshot(snap => {
            snap.forEach(doc => {
                const f = doc.data();
                const div = document.createElement('div');
                div.className = "friend-item";
                div.innerHTML = `<div class="avatar">${f.name.charAt(0).toUpperCase()}</div><span>${f.name}</span>`;
                div.onclick = () => switchChat(doc.id);
                container.appendChild(div);
            });
        });

        // Listen for Online Status
        db.collection("users").onSnapshot(snap => {
            snap.forEach(doc => {
                if(doc.data().status === 'online') {
                    const friendDiv = Array.from(container.children).find(el => el.innerText.includes(doc.data().username));
                    if(friendDiv) friendDiv.classList.add('online');
                }
            });
        });
    }

    function switchChat(chatId) {
        currentChatId = chatId;
        document.getElementById('current-chat-name').innerText = chatId === 'general' ? '# General' : 'Direct Message';
        // Highlight logic would go here
    }

    // MESSAGING
    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if(!text) return;

        db.collection("chats").doc(currentChatId).collection("messages").add({
            sender: currentUser.uid,
            username: document.getElementById('user-display').innerText,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = "";
    }

    function listenToMessages() {
        db.collection("chats").doc(currentChatId).collection("messages")
          .orderBy("timestamp").onSnapshot(snapshot => {
              const box = document.getElementById('messages');
              box.innerHTML = "";
              snapshot.forEach(doc => {
                  const msg = doc.data();
                  const div = document.createElement('div');
                  div.className = `message ${msg.sender === currentUser.uid ? 'msg-self' : 'msg-other'}`;
                  
                  let content = msg.text;
                  if(content.match(/\.(gif|jpeg|jpg|png)$/i)) {
                      content = `<img src="${content}" class="image-msg">`;
                  }
                  
                  div.innerHTML = `<div class="msg-sender">${msg.username}</div>${content}`;
                  box.appendChild(div);
              });
              box.scrollTop = box.scrollHeight;
          });
    }

    // IMAGE UPLOAD
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            db.collection("chats").doc(currentChatId).collection("messages").add({
                sender: currentUser.uid,
                username: document.getElementById('user-display').innerText,
                text: e.target.result, // Base64 string
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        };
        reader.readAsDataURL(file);
    }

    // VIDEO CALLING (PeerJS)
    function startCall() {
        initPeer();
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                myStream = stream;
                document.getElementById('my-video').srcObject = stream;
                document.getElementById('video-overlay').style.display = 'flex';
                
                const call = peer.call('school-general-call', stream);
                call.on('stream', remoteStream => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
            });
    }

    function initPeer() {
        if(peer) return;
        peer = new Peer(currentUser.uid.substring(0, 8)); 
        
        peer.on('call', call => {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                myStream = stream;
                document.getElementById('my-video').srcObject = stream;
                document.getElementById('video-overlay').style.display = 'flex';
                call.answer(stream); 
                call.on('stream', remoteStream => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
            });
        });
    }

    function endCall() {
        if(myStream) myStream.getTracks().forEach(track => track.stop());
        if(peer) peer.disconnect();
        document.getElementById('video-overlay').style.display = 'none';
        myStream = null;
        peer = null;
    }

    function toggleMute() {
        if(myStream) {
            const audioTrack = myStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
        }
    }

    // EMOJI PICKER
    function initEmojiPicker() {
        const picker = new EmojiButton({ theme: 'dark' });
        const trigger = document.getElementById('emoji-trigger');
        const input = document.getElementById('msg-input');
        
        picker.bind(trigger);
        picker.on('emoji', selection => {
            input.value += selection.emoji;
            input.focus();
        });
    }

    // STEALTH MODE
    function toggleStealth() {
        isStealth = !isStealth;
        if(isStealth) {
            document.body.classList.add('stealth-mode');
            document.getElementById('stealth-toggle').innerText = "👁️ Exit Stealth";
        } else {
            document.body.classList.remove('stealth-mode');
            document.getElementById('stealth-toggle').innerText = "👁️ Stealth";
        }
    }

    // LOGOUT FIX
    function logout() {
        updateStatus(false);
        auth.signOut().then(() => {
            window.location.href = "index.html";
        });
    }

    function updateStatus(isOnline) {
        if(auth.currentUser) {
            db.collection("users").doc(auth.currentUser.uid).update({
                status: isOnline ? "online" : "offline",
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    }
</script>

</body>
</html>
