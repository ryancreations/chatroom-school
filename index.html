<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SchoolChat - Login</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #313338; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { background-color: #383A40; padding: 40px; border-radius: 12px; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; position: relative; }
        h2 { margin-bottom: 20px; color: #f2f3f5; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; background-color: #1E1F22; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-google { background-color: white; color: #444; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background-color: #5865F2; color: white; }
        .btn-primary:hover { background-color: #4752C4; }
        .btn-secondary { background-color: transparent; color: #00AFF4; }
        .btn-secondary:hover { text-decoration: underline; }
        .hidden { display: none; }
        .divider { margin: 20px 0; color: #888; font-size: 12px; text-transform: uppercase; }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; background: #5865F2; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 30px; font-weight: bold; }
        #stealth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; z-index: 9999; display: flex; justify-content: center; align-items: center; color: #555; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<!-- Stealth Overlay (Click to enter) -->
<div id="stealth-overlay" onclick="enterApp()">
    📚 Study Session...
</div>

<div class="container">
    <h2 id="form-title">Login to SchoolChat</h2>
    
    <!-- Google Button -->
    <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> 
        Continue with Google
    </button>

    <div class="divider">or use email & username</div>

    <input type="text" id="username" placeholder="Choose a Username" autocomplete="off">
    <input type="email" id="email" placeholder="Email Address" autocomplete="off">
    <input type="password" id="password" placeholder="Password" autocomplete="off">
    <input type="url" id="photoURL" placeholder="Profile Image URL (Optional)" autocomplete="off">

    <button id="action-btn" class="btn-primary" onclick="handleAuth()">Login</button>
    <button class="btn-secondary" onclick="toggleMode()">Create an account</button>
</div>

<script>
    // --- PASTE YOUR FIREBASE CONFIG HERE ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    // ----------------------------------------

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isLoginMode = true;

    function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('action-btn').textContent = isLoginMode ? "Login" : "Register";
        document.querySelector('.btn-secondary').textContent = isLoginMode ? "Create an account" : "Have an account? Login";
        document.getElementById('form-title').textContent = isLoginMode ? "Login to SchoolChat" : "Create Account";
    }

    function enterApp() {
        document.getElementById('stealth-overlay').style.display = 'none';
        requestNotificationPermission();
    }

    function requestNotificationPermission() {
        if ("Notification" in window) {
            Notification.requestPermission();
        }
    }

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then((result) => {
            const user = result.user;
            db.collection("users").doc(user.uid).set({
                username: user.displayName || "User_" + Math.floor(Math.random()*1000),
                email: user.email,
                photoURL: user.photoURL,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                status: "online"
            }, { merge: true }).then(() => {
                updateStatus(true);
                window.location.href = "chat.html";
            });
        }).catch((error) => alert(error.message));
    }

    function handleAuth() {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value.trim();
        const username = document.getElementById('username').value.trim();
        const photo = document.getElementById('photoURL').value.trim();

        if (!email || !pass) return alert("Please enter email and password.");

        if (isLoginMode) {
            auth.signInWithEmailAndPassword(email, pass).then((cred) => {
                updateStatus(true);
                window.location.href = "chat.html";
            }).catch((e) => alert(e.message));
        } else {
            if (!username) return alert("Please pick a username.");
            db.collection("users").where("username", "==", username.toLowerCase()).get().then((snap) => {
                if (!snap.empty) return alert("Username already taken!");
                
                auth.createUserWithEmailAndPassword(email, pass).then((cred) => {
                    cred.user.updateProfile({ displayName: username, photoURL: photo }).then(() => {
                        db.collection("users").doc(cred.user.uid).set({
                            username: username.toLowerCase(),
                            email: email,
                            photoURL: photo,
                            friends: [],
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            status: "online"
                        });
                        updateStatus(true);
                        window.location.href = "chat.html";
                    });
                }).catch((e) => alert(e.message));
            });
        }
    }

    function updateStatus(isOnline) {
        if(auth.currentUser) {
            db.collection("users").doc(auth.currentUser.uid).update({
                status: isOnline ? "online" : "offline",
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    }

    window.addEventListener('beforeunload', () => updateStatus(false));
</script>

</body>
</html>
