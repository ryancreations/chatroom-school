<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolChat - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #313338; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #383A40; padding: 30px; border-radius: 12px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h2 { margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; background-color: #1E1F22; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-google { background-color: white; color: #444; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background-color: #5865F2; color: white; }
        .preview-img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; margin-top: 5px; background: #2B2D31; }
        .hidden { display: none; }
        #error-msg { color: #ed4245; font-size: 12px; margin-bottom: 10px; min-height: 15px;}
    </style>
</head>
<body>

<div class="container" id="login-box">
    <h2 id="form-title">Login to SchoolChat</h2>
    <div id="error-msg"></div>

    <!-- Background Selection -->
    <input type="text" id="lobby-bg-url" placeholder="Paste Image URL for Chat Background..." onchange="updateLobbyPreview()">
    <img id="lobby-preview" class="preview-img" style="height: 100px;">

    <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> 
        Continue with Google
    </button>

    <div class="divider" style="margin: 20px 0; color: #888; font-size: 12px; text-transform: uppercase;">or use email</div>

    <input type="text" id="username" placeholder="Choose a Username" autocomplete="off">
    <input type="email" id="email" placeholder="Email Address" autocomplete="off">
    <input type="password" id="password" placeholder="Password" autocomplete="off">

    <button id="action-btn" class="btn-primary" onclick="handleAuth()">Login</button>
    <button class="btn-secondary" style="background:transparent; color:#00AFF4;" onclick="toggleMode()">Create an account</button>
</div>

<script>
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
  authDomain: "schoolchat-7f5a5.firebaseapp.com",
  databaseURL: "https://schoolchat-7f5a5-default-rtdb.firebaseio.com",
  projectId: "schoolchat-7f5a5",
  storageBucket: "schoolchat-7f5a5.firebasestorage.app",
  messagingSenderId: "752691397853",
  appId: "1:752691397853:web:b4acd05e0259979edfc734",
  measurementId: "G-QS6SVMF7FE"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isLoginMode = true;

    function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('action-btn').textContent = isLoginMode ? "Login" : "Register";
        document.querySelector('.btn-secondary').textContent = isLoginMode ? "Create an account" : "Have an account? Login";
        document.getElementById('form-title').textContent = isLoginMode ? "Login to SchoolChat" : "Create Account";
        document.getElementById('error-msg').innerText = "";
    }

    function showError(msg) {
        document.getElementById('error-msg').innerText = msg;
    }

    function updateLobbyPreview() {
        const url = document.getElementById('lobby-bg-url').value;
        const preview = document.getElementById('lobby-preview');
        if(url) {
            preview.src = url;
        } else {
            preview.src = "";
        }
    }

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then((result) => {
            const user = result.user;
            // Save the background URL to the user's profile
            const bgUrl = document.getElementById('lobby-bg-url').value;
            
            db.collection("users").doc(user.uid).set({
                username: user.displayName || "User_" + Math.floor(Math.random()*1000),
                email: user.email,
                photoURL: user.photoURL,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                status: "online",
                nameColor: "#FFFFFF",
                gradientEnabled: false,
                customBackground: bgUrl // Store background here
            }, { merge: true }).then(() => {
                updateStatus(true);
                enterApp();
            });
        }).catch((error) => showError(error.message));
    }

    function handleAuth() {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value.trim();
        const username = document.getElementById('username').value.trim();
        document.getElementById('error-msg').innerText = "";

        if (!email || !pass) return showError("Please enter email and password.");

        if (isLoginMode) {
            auth.signInWithEmailAndPassword(email, pass).then((cred) => {
                updateStatus(true);
                enterApp();
            }).catch((e) => showError(e.message));
        } else {
            if (!username) return showError("Please pick a username.");
            
            db.collection("users").where("username", "==", username.toLowerCase()).get().then((snap) => {
                if (!snap.empty) return showError("Username already taken!");
                
                auth.createUserWithEmailAndPassword(email, pass).then((cred) => {
                    cred.user.updateProfile({ displayName: username }).then(() => {
                        const bgUrl = document.getElementById('lobby-bg-url').value;
                        db.collection("users").doc(cred.user.uid).set({
                            username: username.toLowerCase(),
                            email: email,
                            photoURL: "",
                            friends: [],
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            status: "online",
                            nameColor: "#FFFFFF",
                            gradientEnabled: false,
                            customBackground: bgUrl // Store background here
                        });
                        updateStatus(true);
                        enterApp();
                    });
                }).catch((e) => showError(e.message));
            });
        }
    }

    function updateStatus(isOnline) {
        if(auth.currentUser) {
            db.collection("users").doc(auth.currentUser.uid).update({
                status: isOnline ? "online" : "offline",
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    }

    function enterApp() {
        window.location.href = "chat.html";
    }

    window.addEventListener('beforeunload', () => updateStatus(false));
</script>

</body>
</html>
