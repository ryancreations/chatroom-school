<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolChat - Login</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #313338;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .container {
      background: #383A40;
      padding: 30px;
      border-radius: 12px;
      width: min(380px, 100%);
      box-shadow: 0 10px 25px rgba(0,0,0,.5);
      text-align: center;
    }

    h2 { margin: 0 0 20px; font-size: 24px; }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      background: #1E1F22;
      color: white;
      font-size: 14px;
    }

    input::placeholder { color: #A0A3A8; }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .btn-google {
      background: white;
      color: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary { background: #5865F2; color: white; }
    .toggle-btn { background: transparent; color: #00AFF4; }

    .preview-img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 5px;
      background: #2B2D31;
    }

    #error-msg {
      color: #ed4245;
      font-size: 13px;
      margin-bottom: 10px;
      min-height: 18px;
      overflow-wrap: anywhere;
    }

    .divider {
      margin: 20px 0;
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="container">
    <h2 id="form-title">Login to SchoolChat</h2>
    <div id="error-msg" role="alert" aria-live="polite"></div>

    <input
      type="url"
      id="lobby-bg-url"
      placeholder="Optional chat background image URL"
      autocomplete="url"
    >
    <img id="lobby-preview" class="preview-img" alt="Background preview" hidden>

    <button class="btn-google" id="google-btn" type="button">
      <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        width="18"
        alt=""
      >
      Continue with Google
    </button>

    <div class="divider">or use email</div>

    <input
      type="text"
      id="username"
      placeholder="Choose a username (registration only)"
      autocomplete="username"
      maxlength="30"
    >
    <input type="email" id="email" placeholder="Email address" autocomplete="email">
    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="action-btn" class="btn-primary" type="button">Login</button>
    <button id="toggle-btn" class="toggle-btn" type="button">Create an account</button>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
      authDomain: "schoolchat-7f5a5.firebaseapp.com",
      databaseURL: "https://schoolchat-7f5a5-default-rtdb.firebaseio.com",
      projectId: "schoolchat-7f5a5",
      storageBucket: "schoolchat-7f5a5.firebasestorage.app",
      messagingSenderId: "752691397853",
      appId: "1:752691397853:web:b4acd05e0259979edfc734",
      measurementId: "G-QS6SVMF7FE"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isLoginMode = true;
    let busy = false;

    const errorEl = document.getElementById("error-msg");
    const actionBtn = document.getElementById("action-btn");
    const toggleBtn = document.getElementById("toggle-btn");
    const googleBtn = document.getElementById("google-btn");
    const bgInput = document.getElementById("lobby-bg-url");
    const preview = document.getElementById("lobby-preview");

    function showError(message) {
      errorEl.textContent = message;
    }

    function setBusy(value) {
      busy = value;
      actionBtn.disabled = value;
      toggleBtn.disabled = value;
      googleBtn.disabled = value;
    }

    function updateModeUI() {
      document.getElementById("form-title").textContent =
        isLoginMode ? "Login to SchoolChat" : "Create Account";
      actionBtn.textContent = isLoginMode ? "Login" : "Register";
      toggleBtn.textContent = isLoginMode
        ? "Create an account"
        : "Have an account? Login";
      document.getElementById("username").disabled = isLoginMode;
      document.getElementById("username").required = !isLoginMode;
      document.getElementById("password").autocomplete =
        isLoginMode ? "current-password" : "new-password";
      showError("");
    }

    function normalizeBackgroundUrl(value) {
      const raw = value.trim();
      if (!raw) return "";

      try {
        const url = new URL(raw);
        if (url.protocol !== "https:" && url.protocol !== "http:") return "";
        return url.href;
      } catch {
        return "";
      }
    }

    bgInput.addEventListener("input", () => {
      const url = normalizeBackgroundUrl(bgInput.value);
      if (!url) {
        preview.removeAttribute("src");
        preview.hidden = true;
        return;
      }

      preview.onload = () => { preview.hidden = false; };
      preview.onerror = () => {
        preview.removeAttribute("src");
        preview.hidden = true;
      };
      preview.src = url;
    });

    toggleBtn.addEventListener("click", () => {
      if (busy) return;
      isLoginMode = !isLoginMode;
      document.getElementById("username").value = "";
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
      updateModeUI();
    });

    function describeAuthError(error) {
      const code = error && error.code;
      const messages = {
        "auth/email-already-in-use": "This email is already registered.",
        "auth/invalid-email": "Enter a valid email address.",
        "auth/invalid-credential": "Email or password is incorrect.",
        "auth/user-not-found": "No account found with that email.",
        "auth/wrong-password": "Email or password is incorrect.",
        "auth/weak-password": "Password should be at least 6 characters.",
        "auth/too-many-requests": "Too many attempts. Try again later.",
        "auth/popup-closed-by-user": "The sign-in window was closed."
      };

      if (messages[code]) return messages[code];
      return error && error.message ? error.message : "Something went wrong.";
    }

    function makeProfile(user, username, background) {
      return {
        username,
        email: user.email || "",
        photoURL: user.photoURL || "",
        friends: [],
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        status: "online",
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        nameColor: "#FFFFFF",
        gradientEnabled: false,
        customBackground: background
      };
    }

    async function createUniqueUsernameProfile(user, requestedUsername, background) {
      const username = requestedUsername.trim().toLowerCase();

      if (!/^[a-z0-9_]{3,30}$/.test(username)) {
        throw new Error("Username must be 3–30 characters: letters, numbers, or underscores.");
      }

      const reservationRef = db.collection("usernames").doc(username);
      const userRef = db.collection("users").doc(user.uid);

      await db.runTransaction(async transaction => {
        const reservation = await transaction.get(reservationRef);

        if (reservation.exists && reservation.data().uid !== user.uid) {
          throw new Error("That username is already taken.");
        }

        transaction.set(reservationRef, { uid: user.uid });
        transaction.set(
          userRef,
          makeProfile(user, username, background),
          { merge: true }
        );
      });
    }

    async function handleAuth() {
      if (busy) return;

      showError("");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const username = document.getElementById("username").value.trim();
      const background = normalizeBackgroundUrl(bgInput.value);

      if (!email || !password) {
        showError("Enter your email address and password.");
        return;
      }

      if (!isLoginMode && !username) {
        showError("Choose a username.");
        return;
      }

      setBusy(true);

      try {
        if (isLoginMode) {
          await auth.signInWithEmailAndPassword(email, password);
        } else {
          const credential = await auth.createUserWithEmailAndPassword(email, password);
          const user = credential.user;

          try {
            await user.updateProfile({ displayName: username.trim() });
            await createUniqueUsernameProfile(user, username, background);
          } catch (error) {
            // Clean up the newly created auth account if profile setup fails.
            try { await user.delete(); } catch (cleanupError) {
              console.error("Could not clean up incomplete account:", cleanupError);
            }
            throw error;
          }
        }

        window.location.href = "chat.html";
      } catch (error) {
        console.error(error);
        showError(describeAuthError(error));
      } finally {
        setBusy(false);
      }
    }

    async function loginWithGoogle() {
      if (busy) return;

      showError("");
      setBusy(true);

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        const user = result.user;
        const userRef = db.collection("users").doc(user.uid);
        const existing = await userRef.get();
        const background = normalizeBackgroundUrl(bgInput.value);

        if (existing.exists) {
          const update = {
            email: user.email || "",
            photoURL: user.photoURL || "",
            status: "online",
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
          };
          if (background) update.customBackground = background;
          await userRef.update(update);
        } else {
          const base = (user.displayName || "user")
            .toLowerCase()
            .replace(/[^a-z0-9_]/g, "_")
            .replace(/^_+|_+$/g, "")
            .slice(0, 24) || "user";

          // Try a few deterministic candidates. The transaction prevents
          // two accounts from claiming the same reservation simultaneously.
          let created = false;
          for (let attempt = 0; attempt < 20 && !created; attempt++) {
            const candidate = attempt === 0
              ? base
              : `${base}_${Math.floor(1000 + Math.random() * 9000)}`;

            try {
              await createUniqueUsernameProfile(user, candidate, background);
              created = true;
            } catch (error) {
              if (error.message !== "That username is already taken.") throw error;
            }
          }

          if (!created) {
            throw new Error("Could not find an available username. Please try again.");
          }
        }

        window.location.href = "chat.html";
      } catch (error) {
        console.error(error);
        showError(describeAuthError(error));
      } finally {
        setBusy(false);
      }
    }

    actionBtn.addEventListener("click", handleAuth);
    googleBtn.addEventListener("click", loginWithGoogle);

    document.addEventListener("keydown", event => {
      if (event.key === "Enter" && !busy) handleAuth();
    });

    updateModeUI();

    auth.onAuthStateChanged(user => {
      if (user) window.location.href = "chat.html";
    });
  </script>
</body>
</html>
