<!DOCTYPE html>
<html>
<head>
    <title>SchoolChat - Login</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #313338;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #383A40;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #f2f3f5;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            background: #1E1F22;
            color: white;
        }
        .btn-blue {
            width: 97%;
            padding: 12px;
            background: #5865F2;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 10px;
        }
        .btn-blue:hover {
            background: #4752C4;
        }
        .btn-google {
            width: 97%;
            padding: 12px;
            background: white;
            color: #444;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .divider {
            margin: 20px 0;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>SchoolChat</h2>

        <!-- Google Login Button -->
        <button class="btn-google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google logo">
            Continue with Google
        </button>

        <div class="divider">or use email</div>

        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Password">

        <button class="btn-blue" onclick="login()">Login</button>
        <button onclick="signUp()" style="background:transparent; color:#00AFF4; border:none; cursor:pointer; margin-top:15px; font-size:13px;">Need an account? Register</button>
    </div>

    <script>
       // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
  authDomain: "schoolchat-7f5a5.firebaseapp.com",
  projectId: "schoolchat-7f5a5",
  storageBucket: "schoolchat-7f5a5.firebasestorage.app",
  messagingSenderId: "752691397853",
  appId: "1:752691397853:web:b4acd05e0259979edfc734",
  measurementId: "G-QS6SVMF7FE"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        function loginWithGoogle() {
            auth.signInWithPopup(googleProvider)
                .then(() => window.location.href = "chat.html")
                .catch(err => alert(err.message));
        }

        function signUp() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => window.location.href = "chat.html")
                .catch(err => alert(err.message));
        }

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => window.location.href = "chat.html")
                .catch(err => alert(err.message));
        }
    </script>
</body>
</html>
