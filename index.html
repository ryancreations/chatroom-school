<!DOCTYPE html>
<html>
<head>
    <title>Simple PeerJS Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        #my-id { margin-bottom: 10px; font-weight: bold; }
        #peer-id-input { width: 200px; padding: 5px; }
        #messages { width: 90vw; max-width: 600px; height: 300px; background: white; border: 1px solid #ccc; overflow-y: auto; padding: 10px; margin-top: 10px; border-radius: 5px; }
        .msg { margin-bottom: 5px; padding: 8px; border-radius: 5px; max-width: 70%; word-wrap: break-word; }
        .local { background-color: #dcf8c6; align-self: flex-end; }
        .remote { background-color: #fff; border: 1px solid #ccc; }
        #text-input { width: 70%; padding: 8px; }
        button { padding: 8px 12px; margin-left: 5px; cursor: pointer; }
        #input-area { margin-top: 10px; display: flex; justify-content: center; }
    </style>
</head>
<body>

<h2>PeerJS Chat</h2>
<div>Your ID: <span id="my-id">Loading...</span></div>
<input id="peer-id-input" placeholder="Enter friend's ID" />
<button onclick="connectToPeer()">Connect</button>

<div id="messages"></div>

<div id="input-area">
    <input id="text-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()" />
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    let peer = new Peer();
    let conn;

    peer.on('open', id => {
        document.getElementById('my-id').innerText = id;
    });

    peer.on('connection', connection => {
        conn = connection;
        setupConnection();
    });

    function connectToPeer() {
        const friendId = document.getElementById('peer-id-input').value.trim();
        if (!friendId) { alert('Please enter a friend’s ID'); return; }
        conn = peer.connect(friendId);
        setupConnection();
    }

    function setupConnection() {
        const messages = document.getElementById('messages');
        messages.innerHTML += '<div><em>Connected!</em></div>';

        conn.on('data', data => {
            appendMessage(data, 'remote');
        });

        conn.on('close', () => {
            messages.innerHTML += '<div><em>Connection closed.</em></div>';
        });
    }

    function sendMessage() {
        const input = document.getElementById('text-input');
        const msg = input.value.trim();
        if (!msg) return;
        if (conn && conn.open) {
            conn.send(msg);
            appendMessage(msg, 'local');
            input.value = '';
        } else {
            alert('Not connected to anyone yet!');
        }
    }

    function appendMessage(msg, type) {
        const messages = document.getElementById('messages');
        const div = document.createElement('div');
        div.textContent = msg;
        div.className = 'msg ' + type;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }
</script>

</body>
</html>
