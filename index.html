<!DOCTYPE html>
<html>
<head>
  <title>SchoolChat - Login / Register</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #313338; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { background: #383A40; padding: 30px; border-radius: 10px; width: 360px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); text-align: center; }
    h2 { margin-bottom: 20px; }
    input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 5px; border: none; background: #1E1F22; color: white; }
    button { width: 95%; padding: 12px; margin-top: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    #google-btn { background: white; color: #444; display: flex; justify-content: center; align-items: center; gap: 8px; }
    #google-btn img { width: 18px; }
    #signin, #signup { background: #5865F2; color: white; }
    #toggle-auth { background: transparent; color: #00AFF4; font-size: 13px; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="form-title">Login to SchoolChat</h2>

    <button id="google-btn"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"> Continue with Google</button>

    <div style="margin:20px 0; font-size: 12px; color: #888;">OR</div>

    <input type="text" id="username" placeholder="Username" style="display:none;" autocomplete="off" />
    <input type="email" id="email" placeholder="Email" autocomplete="off" />
    <input type="password" id="password" placeholder="Password" />

    <button id="signin">Login</button>
    <button id="signup" style="display:none;">Register</button>

    <div id="toggle-auth">Create an account</div>
  </div>

  <script>
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
  authDomain: "schoolchat-7f5a5.firebaseapp.com",
  projectId: "schoolchat-7f5a5",
  storageBucket: "schoolchat-7f5a5.firebasestorage.app",
  messagingSenderId: "752691397853",
  appId: "1:752691397853:web:b4acd05e0259979edfc734",
  measurementId: "G-QS6SVMF7FE"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    const googleBtn = document.getElementById('google-btn');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const signinBtn = document.getElementById('signin');
    const signupBtn = document.getElementById('signup');
    const toggleAuthText = document.getElementById('toggle-auth');
    const formTitle = document.getElementById('form-title');

    let isLogin = true;

    toggleAuthText.onclick = () => {
      isLogin = !isLogin;
      if(isLogin) {
        usernameInput.style.display = 'none';
        signupBtn.style.display = 'none';
        signinBtn.style.display = 'block';
        toggleAuthText.textContent = 'Create an account';
        formTitle.textContent = 'Login to SchoolChat';
      } else {
        usernameInput.style.display = 'block';
        signupBtn.style.display = 'block';
        signinBtn.style.display = 'none';
        toggleAuthText.textContent = 'Have an account? Login';
        formTitle.textContent = 'Register an Account';
      }
    };

    googleBtn.onclick = () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(result => {
          // On first google sign-in, create user record if missing
          const user = result.user;
          const userRef = db.collection('users').doc(user.uid);
          userRef.get().then(doc => {
            if(!doc.exists) {
              userRef.set({
                username: user.displayName.replace(/\s+/g, '').toLowerCase(),
                email: user.email,
                friends: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            }
          }).then(() => window.location.href = 'chat.html');
        })
        .catch(e => alert(e.message));
    };

    signinBtn.onclick = () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if(!email || !password) return alert('Enter email and password');

      auth.signInWithEmailAndPassword(email, password)
      .then(cred => {
        window.location.href = 'chat.html';
      })
      .catch(e => alert(e.message));
    };

    signupBtn.onclick = () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const username = usernameInput.value.trim().toLowerCase();

      if(!username || !email || !password) return alert('Fill username, email, and password');
      if(username.includes(' ')) return alert('Username cannot contain spaces');

      // Check if username already exists
      db.collection('users').where('username', '==', username).get()
      .then(snapshot => {
        if(!snapshot.empty) {
          alert('Username already taken');
          return;
        }

        // Create user
        auth.createUserWithEmailAndPassword(email, password)
        .then(cred => {
          return db.collection('users').doc(cred.user.uid).set({
            username: username,
            email: email,
            friends: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        })
        .then(() => window.location.href = 'chat.html')
        .catch(e => alert(e.message));
      });
    };

  </script>
</body>
</html>
