<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolChat - Login</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #313338;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #383A40;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #f2f3f5; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: none;
            background-color: #1E1F22;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-google {
            background-color: white;
            color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary { background-color: #5865F2; color: white; }
        .btn-primary:hover { background-color: #4752C4; }
        .btn-secondary { background-color: transparent; color: #00AFF4; }
        .btn-secondary:hover { text-decoration: underline; }
        .hidden { display: none; }
        .divider { margin: 20px 0; color: #888; font-size: 12px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="form-title">Login to SchoolChat</h2>
    
    <!-- Google Button -->
    <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> 
        Continue with Google
    </button>

    <div class="divider">or use email & username</div>

    <input type="text" id="username" placeholder="Choose a Username" autocomplete="off">
    <input type="email" id="email" placeholder="Email Address" autocomplete="off">
    <input type="password" id="password" placeholder="Password" autocomplete="off">

    <button id="action-btn" class="btn-primary" onclick="handleAuth()">Login</button>
    <button class="btn-secondary" onclick="toggleMode()">Create an account</button>
</div>

<script>
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
  authDomain: "schoolchat-7f5a5.firebaseapp.com",
  projectId: "schoolchat-7f5a5",
  storageBucket: "schoolchat-7f5a5.firebasestorage.app",
  messagingSenderId: "752691397853",
  appId: "1:752691397853:web:b4acd05e0259979edfc734",
  measurementId: "G-QS6SVMF7FE"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isLoginMode = true;

    function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('action-btn').textContent = isLoginMode ? "Login" : "Register";
        document.querySelector('.btn-secondary').textContent = isLoginMode ? "Create an account" : "Have an account? Login";
        document.getElementById('form-title').textContent = isLoginMode ? "Login to SchoolChat" : "Create Account";
    }

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then((result) => {
            const user = result.user;
            // Ensure user data exists in database
            db.collection("users").doc(user.uid).set({
                username: user.displayName || "User_" + Math.floor(Math.random()*1000),
                email: user.email,
                photoURL: user.photoURL,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(() => {
                window.location.href = "chat.html";
            });
        }).catch((error) => alert(error.message));
    }

    function handleAuth() {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value.trim();
        const username = document.getElementById('username').value.trim();

        if (!email || !pass) return alert("Please enter email and password.");

        if (isLoginMode) {
            auth.signInWithEmailAndPassword(email, pass).then((cred) => {
                window.location.href = "chat.html";
            }).catch((e) => alert(e.message));
        } else {
            if (!username) return alert("Please pick a username.");
            // Check if username taken
            db.collection("users").where("username", "==", username.toLowerCase()).get().then((snap) => {
                if (!snap.empty) return alert("Username already taken!");
                
                auth.createUserWithEmailAndPassword(email, pass).then((cred) => {
                    cred.user.updateProfile({ displayName: username }).then(() => {
                        db.collection("users").doc(cred.user.uid).set({
                            username: username.toLowerCase(),
                            email: email,
                            friends: [],
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        window.location.href = "chat.html";
                    });
                }).catch((e) => alert(e.message));
            });
        }
    }
</script>

</body>
</html>
