<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SchoolChat App</title>
<style>
  body {
    background: #36393f;
    color: #dcddde;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #2f3136;
    padding: 10px 15px;
    font-size: 20px;
    font-weight: 600;
    color: white;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background-color: #36393f;
  }

  .message {
    background: #40444b;
    padding: 8px 12px;
    margin-bottom: 10px;
    border-radius: 5px;
    max-width: 70%;
    word-wrap: break-word;
  }

  .message.own {
    background: #5865f2;
    color: white;
    margin-left: auto;
  }

  #input-area {
    background: #2f3136;
    padding: 10px;
    display: flex;
    gap: 10px;
  }

  input[type='text'] {
    flex: 1;
    padding: 10px;
    border-radius: 4px;
    border: none;
    background: #40444b;
    color: white;
    font-size: 16px;
  }

  button {
    background: #5865f2;
    border: none;
    border-radius: 4px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    padding: 0 15px;
    font-size: 16px;
  }

  #login-area {
    display: flex;
    flex-direction: column;
    max-width: 320px;
    margin: auto;
    padding: 20px;
    background: #2f3136;
    border-radius: 8px;
    margin-top: 60px;
  }

  #login-area input {
    margin-bottom: 15px;
    padding: 12px;
    font-size: 16px;
    border-radius: 4px;
    border: none;
  }

  #login-area button {
    margin-top: 5px;
  }

  #logout-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #f04747;
  }

</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js"></script>
</head>
<body>
<header>SchoolChat</header>

<div id="login-area">
  <input type="text" id="username" placeholder="Choose your username" />
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Password" />
  <button id="signup-btn">Sign Up</button>
  <button id="login-btn">Log In</button>
  <button id="google-btn">Sign In with Google</button>
  <p id="login-error" style="color: #f04747;"></p>
</div>

<button id="logout-btn" style="display:none;">Logout</button>

<div id="chat" style="display:none;"></div>

<div id="input-area" style="display:none;">
  <input type="text" id="message-input" placeholder="Type a message" autocomplete="off" />
  <button id="send-btn">Send</button>
</div>

<script>
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
  authDomain: "schoolchat-7f5a5.firebaseapp.com",
  projectId: "schoolchat-7f5a5",
  storageBucket: "schoolchat-7f5a5.firebasestorage.app",
  messagingSenderId: "752691397853",
  appId: "1:752691397853:web:b4acd05e0259979edfc734",
  measurementId: "G-QS6SVMF7FE"
};

  // Initialize Firebase
  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  // Elements
  const loginArea = document.getElementById('login-area');
  const logoutBtn = document.getElementById('logout-btn');
  const chatDiv = document.getElementById('chat');
  const inputArea = document.getElementById('input-area');

  const usernameInput = document.getElementById('username');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginError = document.getElementById('login-error');

  const loginBtn = document.getElementById('login-btn');
  const signupBtn = document.getElementById('signup-btn');
  const googleBtn = document.getElementById('google-btn');

  const messageInput = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');

  // Sign up function
  signupBtn.onclick = function() {
    loginError.textContent = '';
    const username = usernameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (username.length < 3) {
      loginError.textContent = 'Username must be at least 3 characters.';
      return;
    }
    if (!email || !password) {
      loginError.textContent = 'Enter email and password.';
      return;
    }
    auth.createUserWithEmailAndPassword(email, password)
      .then(userCredential => {
        return userCredential.user.updateProfile({ displayName: username });
      })
      .catch(error => {
        loginError.textContent = error.message;
      });
  };

  // Login function
  loginBtn.onclick = function() {
    loginError.textContent = '';
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      loginError.textContent = 'Enter email and password.';
      return;
    }
    auth.signInWithEmailAndPassword(email, password)
      .catch(error => {
        loginError.textContent = error.message;
      });
  };

  // Google login
  googleBtn.onclick = function() {
    loginError.textContent = '';
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
      .catch(error => {
        loginError.textContent = error.message;
      });
  };

  // Logout
  logoutBtn.onclick = function() {
    auth.signOut();
  };

  // Listen to auth state
  auth.onAuthStateChanged(user => {
    if (user) {
      loginArea.style.display = 'none';
      logoutBtn.style.display = 'block';
      chatDiv.style.display = 'block';
      inputArea.style.display = 'flex';
      startListeningForMessages();
    } else {
      loginArea.style.display = 'flex';
      logoutBtn.style.display = 'none';
      chatDiv.style.display = 'none';
      inputArea.style.display = 'none';
      chatDiv.innerHTML = '';
      messageInput.value = '';
    }
  });

  // Send message
  sendBtn.onclick = sendMessage;
  messageInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      sendMessage();
    }
  });

  function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) return;
    const user = auth.currentUser;
    if (!user) return;

    const newMsgRef = db.ref('messages').push();
    newMsgRef
      .set({
        uid: user.uid,
        username: user.displayName || user.email,
        text: text,
        timestamp: Date.now()
      })
      .then(() => {
        messageInput.value = '';
      });
  }

  // Listen for messages
  function startListeningForMessages() {
    const messagesRef = db.ref('messages');
    messagesRef.off();
    messagesRef.on('child_added', snapshot => {
      const msg = snapshot.val();
      displayMessage(msg);
    });
  }

  function displayMessage(msg) {
    if (!chatDiv) return;
    const div = document.createElement('div');
    div.classList.add('message');
    if (auth.currentUser && msg.uid === auth.currentUser.uid) {
      div.classList.add('own');
    }
    const timeString = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `<strong>${escapeHtml(msg.username)}</strong>: ${linkify(escapeHtml(msg.text))} <br><small style='opacity:0.6;'>${timeString}</small>`;
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"]/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;'
    }[c]));
  }

  // Simple linkify for URLs
  function linkify(text) {
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
  }
</script>
</body>
</html>
