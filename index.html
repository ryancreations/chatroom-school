<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Hub</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #bb86fc; margin-bottom: 30px; }

        /* --- FEED STYLES --- */
        #feed {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 100px; /* Space for the stealth box */
        }

        .post-card {
            background: #1f1f1f;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
            word-wrap: break-word;
        }

        .post-text {
            margin-bottom: 10px;
            font-size: 1rem;
            line-height: 1.4;
        }

        .media-container img {
            max-width: 100%;
            border-radius: 4px;
            margin-top: 5px;
        }

        .media-container iframe {
            width: 100%;
            height: 315px;
            border: none;
            border-radius: 4px;
            margin-top: 5px;
        }

        /* --- STEALTH INPUT BOX (Bottom Right) --- */
        #stealth-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border: 1px solid #444;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        #stealth-box:hover {
            transform: translateY(-5px);
            border-color: #bb86fc;
        }

        #stealth-input {
            width: 90%;
            padding: 10px;
            background: #121212;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        #stealth-btn {
            width: 100%;
            padding: 10px;
            background: #bb86fc;
            border: none;
            color: black;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        #stealth-btn:hover { background: #9965f4; }

        .label { font-size: 0.8rem; color: #aaa; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <h1>Media Share</h1>
    <div id="feed">Loading...</div>

    <!-- STEALTH INPUT BOX -->
    <div id="stealth-box">
        <span class="label">Add Link or Text</span>
        <input type="text" id="stealth-input" placeholder="Paste YouTube/Image link here...">
        <button id="stealth-btn">Post</button>
    </div>

    <script>
       // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
  authDomain: "schoolchat-7f5a5.firebaseapp.com",
  databaseURL: "https://schoolchat-7f5a5-default-rtdb.firebaseio.com",
  projectId: "schoolchat-7f5a5",
  storageBucket: "schoolchat-7f5a5.firebasestorage.app",
  messagingSenderId: "752691397853",
  appId: "1:752691397853:web:b4acd05e0259979edfc734",
  measurementId: "G-QS6SVMF7FE"
};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- DOM ELEMENTS ---
        const feedDiv = document.getElementById('feed');
        const inputField = document.getElementById('stealth-input');
        const postBtn = document.getElementById('stealth-btn');

        // --- HELPER: Parse Links ---
        function parseContent(rawInput) {
            // Check for YouTube
            const ytRegex = /^(?:https?:\/\/)?(?:www\.)?(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/;
            const match = rawInput.match(ytRegex);
            
            if (match && match[1]) {
                return `<div class="media-container"><iframe src="https://www.youtube.com/embed/${match[1]}" allowfullscreen></iframe></div>`;
            }

            // Check for Image
            const imgRegex = /\.(jpg|jpeg|png|gif|webp)$/i;
            if (imgRegex.test(rawInput.trim())) {
                return `<div class="media-container"><img src="${rawInput.trim()}" alt="Shared Image"></div>`;
            }

            // Plain Text
            return `<div class="post-text">${rawInput}</div>`;
        }

        // --- ADD POST TO DATABASE ---
        postBtn.addEventListener('click', async () => {
            const text = inputField.value.trim();
            if (!text) return;

            try {
                await db.collection('posts').add({
                    content: text,
                    parsedHtml: parseContent(text),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    uid: firebase.auth().currentUser ? firebase.auth().currentUser.uid : 'anonymous'
                });
                inputField.value = ''; // Clear input
            } catch (error) {
                console.error("Error adding post: ", error);
                alert("Failed to post. Check console.");
            }
        });

        // --- LISTEN FOR UPDATES ---
        db.collection('posts').orderBy('timestamp', 'desc').limit(50).onSnapshot((snapshot) => {
            feedDiv.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement('div');
                div.className = 'post-card';
                div.innerHTML = data.parsedHtml || `<div class="post-text">${data.content}</div>`;
                feedDiv.appendChild(div);
            });
        });

    </script>
</body>
</html>
