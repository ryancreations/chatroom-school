<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolChat - Login</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #313338;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .container {
      background: #383A40;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,.5);
      text-align: center;
    }

    h2 { margin: 0 0 20px; font-size: 24px; }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      background: #1E1F22;
      color: white;
      font-size: 14px;
    }

    input::placeholder { color: #A0A3A8; }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: wait; }

    .btn-google {
      background: white;
      color: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary { background: #5865F2; color: white; }

    .preview-img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 5px;
      background: #2B2D31;
    }

    #error-msg {
      color: #ed4245;
      font-size: 12px;
      margin-bottom: 10px;
      min-height: 15px;
      overflow-wrap: anywhere;
    }

    .divider {
      margin: 20px 0;
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
    }

    .toggle-btn {
      background: transparent;
      color: #00AFF4;
      margin-top: 5px;
    }

    .toggle-btn:hover { background: rgba(0,175,244,.1); }
  </style>
</head>

<body>
  <main class="container">
    <h2 id="form-title">Login to SchoolChat</h2>
    <div id="error-msg" role="alert" aria-live="polite"></div>

    <input
      type="url"
      id="lobby-bg-url"
      placeholder="Chat background image URL (optional)"
      autocomplete="url"
    >
    <img id="lobby-preview" class="preview-img" alt="Background preview" hidden>

    <button id="google-btn" class="btn-google" type="button">
      <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        width="18"
        alt=""
      >
      Continue with Google
    </button>

    <div class="divider">or use email</div>

    <input
      type="text"
      id="username"
      placeholder="Choose a username"
      autocomplete="username"
      maxlength="30"
      hidden
    >
    <input type="email" id="email" placeholder="Email address" autocomplete="email">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">

    <button id="action-btn" class="btn-primary" type="button">Login</button>
    <button id="toggle-btn" class="toggle-btn" type="button">Create an account</button>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
      authDomain: "schoolchat-7f5a5.firebaseapp.com",
      databaseURL: "https://schoolchat-7f5a5-default-rtdb.firebaseio.com",
      projectId: "schoolchat-7f5a5",
      storageBucket: "schoolchat-7f5a5.firebasestorage.app",
      messagingSenderId: "752691397853",
      appId: "1:752691397853:web:b4acd05e0259979edfc734",
      measurementId: "G-QS6SVMF7FE"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isLoginMode = true;

    const $ = id => document.getElementById(id);
    const errorEl = $("error-msg");
    const actionBtn = $("action-btn");
    const googleBtn = $("google-btn");

    function showError(message) {
      errorEl.textContent = message;
    }

    function setBusy(busy) {
      actionBtn.disabled = busy;
      googleBtn.disabled = busy;
      $("toggle-btn").disabled = busy;
    }

    function normalizeUsername(value) {
      return value.trim().toLowerCase();
    }

    function validateUsername(value) {
      if (value.length < 3 || value.length > 30) {
        return "Username must be between 3 and 30 characters.";
      }
      if (!/^[a-z0-9_]+$/.test(value)) {
        return "Use only lowercase letters, numbers, and underscores.";
      }
      return "";
    }

    function toggleMode() {
      isLoginMode = !isLoginMode;
      showError("");

      $("form-title").textContent =
        isLoginMode ? "Login to SchoolChat" : "Create Account";
      actionBtn.textContent = isLoginMode ? "Login" : "Register";
      $("toggle-btn").textContent =
        isLoginMode ? "Create an account" : "Have an account? Login";
      $("username").hidden = isLoginMode;
      $("password").autocomplete =
        isLoginMode ? "current-password" : "new-password";
    }

    async function saveGoogleProfile(user) {
      const userRef = db.collection("users").doc(user.uid);
      const userSnap = await userRef.get();

      if (!userSnap.exists) {
        const baseName = (user.displayName || "user")
          .toLowerCase()
          .replace(/[^a-z0-9_]/g, "")
          .slice(0, 22) || "user";

        const username = baseName + "_" + user.uid.slice(0, 6);

        await userRef.set({
          username,
          email: user.email || "",
          photoURL: user.photoURL || "",
          friends: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          customBackground: $("lobby-bg-url").value.trim()
        });
      }
    }

    async function loginWithGoogle() {
      showError("");
      setBusy(true);

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        await saveGoogleProfile(result.user);
        window.location.href = "chat.html";
      } catch (error) {
        console.error("Google sign-in/profile error:", error);
        showError(error.message || "Google sign-in failed.");
      } finally {
        setBusy(false);
      }
    }

    async function handleAuth() {
      showError("");

      const email = $("email").value.trim();
      const password = $("password").value;
      const username = normalizeUsername($("username").value);

      if (!email || !password) {
        showError("Please enter your email and password.");
        return;
      }

      setBusy(true);

      try {
        if (isLoginMode) {
          await auth.signInWithEmailAndPassword(email, password);
          window.location.href = "chat.html";
          return;
        }

        if (!username) {
          showError("Please choose a username.");
          return;
        }

        const usernameError = validateUsername(username);
        if (usernameError) {
          showError(usernameError);
          return;
        }

        // Reserve the username and create the profile atomically.
        // The security rules below must include /usernames/{username}.
        const credential = await auth.createUserWithEmailAndPassword(
          email,
          password
        );

        const user = credential.user;
        const usernameRef = db.collection("usernames").doc(username);
        const profileRef = db.collection("users").doc(user.uid);

        try {
          await db.runTransaction(async transaction => {
            const reservation = await transaction.get(usernameRef);
            if (reservation.exists) {
              throw new Error("USERNAME_TAKEN");
            }

            transaction.set(usernameRef, { uid: user.uid });
            transaction.set(profileRef, {
              username,
              email,
              photoURL: "",
              friends: [],
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              customBackground: $("lobby-bg-url").value.trim()
            });
          });

          await user.updateProfile({ displayName: username });
          window.location.href = "chat.html";
        } catch (error) {
          // Remove the newly-created Auth account if profile creation failed.
          try { await user.delete(); } catch (deleteError) {
            console.error("Could not clean up failed account:", deleteError);
          }
          throw error;
        }
      } catch (error) {
        console.error("Authentication error:", error);

        const code = error.code || "";
        if (error.message === "USERNAME_TAKEN") {
          showError("That username is already taken.");
        } else if (code.includes("email-already-in-use")) {
          showError("This email is already registered.");
        } else if (code.includes("weak-password")) {
          showError("Password should be at least 6 characters.");
        } else if (code.includes("invalid-email")) {
          showError("Please enter a valid email address.");
        } else if (code.includes("permission-denied")) {
          showError("Firestore denied the profile write. Check the published rules.");
        } else {
          showError(error.message || "Could not complete sign-in.");
        }
      } finally {
        setBusy(false);
      }
    }

    $("toggle-btn").addEventListener("click", toggleMode);
    actionBtn.addEventListener("click", handleAuth);
    googleBtn.addEventListener("click", loginWithGoogle);

    $("lobby-bg-url").addEventListener("input", () => {
      const url = $("lobby-bg-url").value.trim();
      const preview = $("lobby-preview");

      if (!url) {
        preview.hidden = true;
        preview.removeAttribute("src");
        return;
      }

      preview.src = url;
      preview.hidden = false;
      preview.onerror = () => {
        preview.hidden = true;
        preview.removeAttribute("src");
      };
    });

    $("password").addEventListener("keydown", event => {
      if (event.key === "Enter") handleAuth();
    });
  </script>
</body>
</html>
