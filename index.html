<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SchoolChat - Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #313338; color: white; display: flex;
      justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 16px;
    }
    .container {
      background: #383A40; padding: 30px; border-radius: 12px;
      width: min(380px, 100%); box-shadow: 0 10px 25px #0008;
      text-align: center;
    }
    h2 { margin: 0 0 18px; }
    input {
      width: 100%; padding: 12px; margin: 8px 0; border: 0;
      border-radius: 6px; background: #1E1F22; color: white;
    }
    button {
      width: 100%; padding: 12px; margin-top: 10px;
      border: 0; border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .primary { background: #5865F2; color: white; }
    .google { background: white; color: #444; }
    .toggle { background: transparent; color: #00AFF4; }
    #error-msg { min-height: 20px; color: #ED4245; font-size: 13px; overflow-wrap: anywhere; }
    #lobby-preview { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; }
    .divider { margin: 16px 0; color: #aaa; font-size: 12px; }
  </style>
</head>
<body>
  <main class="container">
    <h2 id="form-title">Login to SchoolChat</h2>
    <div id="error-msg" role="alert" aria-live="polite"></div>

    <input id="lobby-bg-url" type="url" placeholder="Optional chat background image URL">
    <img id="lobby-preview" alt="Background preview" hidden>

    <button class="google" id="google-btn" type="button">Continue with Google</button>
    <div class="divider">or use email</div>

    <input id="username" type="text" maxlength="30" placeholder="Username (for registration)" autocomplete="username">
    <input id="email" type="email" placeholder="Email address" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button class="primary" id="action-btn" type="button">Login</button>
    <button class="toggle" id="toggle-btn" type="button">Create an account</button>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBPC0x93NkRWCxMUA0c8xkS-jQa2IdbysI",
      authDomain: "schoolchat-7f5a5.firebaseapp.com",
      databaseURL: "https://schoolchat-7f5a5-default-rtdb.firebaseio.com",
      projectId: "schoolchat-7f5a5",
      storageBucket: "schoolchat-7f5a5.firebasestorage.app",
      messagingSenderId: "752691397853",
      appId: "1:752691397853:web:b4acd05e0259979edfc734",
      measurementId: "G-QS6SVMF7FE"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const $ = id => document.getElementById(id);
    let loginMode = true;
    let busy = false;

    function showError(message) { $("error-msg").textContent = message; }

    function setBusy(value) {
      busy = value;
      $("action-btn").disabled = value;
      $("toggle-btn").disabled = value;
      $("google-btn").disabled = value;
    }

    function updateMode() {
      $("form-title").textContent = loginMode ? "Login to SchoolChat" : "Create Account";
      $("action-btn").textContent = loginMode ? "Login" : "Register";
      $("toggle-btn").textContent = loginMode ? "Create an account" : "Have an account? Login";
      $("username").disabled = loginMode;
      $("username").required = !loginMode;
      $("password").autocomplete = loginMode ? "current-password" : "new-password";
      showError("");
    }

    function validHttpUrl(value) {
      if (!value.trim()) return "";
      try {
        const url = new URL(value.trim());
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    $("lobby-bg-url").addEventListener("input", () => {
      const url = validHttpUrl($("lobby-bg-url").value);
      const image = $("lobby-preview");
      if (!url) {
        image.removeAttribute("src");
        image.hidden = true;
        return;
      }
      image.onload = () => { image.hidden = false; };
      image.onerror = () => { image.removeAttribute("src"); image.hidden = true; };
      image.src = url;
    });

    $("toggle-btn").addEventListener("click", () => {
      if (busy) return;
      loginMode = !loginMode;
      $("username").value = "";
      $("email").value = "";
      $("password").value = "";
      updateMode();
    });

    function authError(error) {
      const messages = {
        "auth/email-already-in-use": "This email is already registered.",
        "auth/invalid-email": "Enter a valid email address.",
        "auth/invalid-credential": "Email or password is incorrect.",
        "auth/user-not-found": "No account found with that email.",
        "auth/wrong-password": "Email or password is incorrect.",
        "auth/weak-password": "Password should be at least 6 characters.",
        "auth/too-many-requests": "Too many attempts. Try again later.",
        "auth/popup-closed-by-user": "The sign-in window was closed."
      };
      return messages[error.code] || error.message || "Something went wrong.";
    }

    async function reserveUsername(user, username, background) {
      const name = username.trim().toLowerCase();
      if (!/^[a-z0-9_]{3,30}$/.test(name)) {
        throw new Error("Username must be 3–30 characters using letters, numbers, or underscores.");
      }

      const nameRef = db.collection("usernames").doc(name);
      const userRef = db.collection("users").doc(user.uid);

      await db.runTransaction(async transaction => {
        const reserved = await transaction.get(nameRef);
        if (reserved.exists && reserved.data().uid !== user.uid) {
          throw new Error("That username is already taken.");
        }

        transaction.set(nameRef, { uid: user.uid });
        transaction.set(userRef, {
          username: name,
          email: user.email || "",
          photoURL: user.photoURL || "",
          friends: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          status: "online",
          lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
          nameColor: "#FFFFFF",
          gradientEnabled: false,
          customBackground: background
        }, { merge: true });
      });
    }

    async function handleAuth() {
      if (busy) return;
      showError("");

      const email = $("email").value.trim();
      const password = $("password").value;
      const username = $("username").value.trim();
      const background = validHttpUrl($("lobby-bg-url").value);

      if (!email || !password) return showError("Enter your email and password.");
      if (!loginMode && !username) return showError("Choose a username.");

      setBusy(true);
      try {
        if (loginMode) {
          await auth.signInWithEmailAndPassword(email, password);
        } else {
          const credential = await auth.createUserWithEmailAndPassword(email, password);
          try {
            await credential.user.updateProfile({ displayName: username });
            await reserveUsername(credential.user, username, background);
          } catch (error) {
            try { await credential.user.delete(); } catch (cleanupError) {
              console.error("Account cleanup failed:", cleanupError);
            }
            throw error;
          }
        }
        window.location.href = "chat.html";
      } catch (error) {
        console.error(error);
        showError(authError(error));
      } finally {
        setBusy(false);
      }
    }

    async function loginWithGoogle() {
      if (busy) return;
      setBusy(true);
      showError("");

      try {
        const result = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        const user = result.user;
        const userRef = db.collection("users").doc(user.uid);
        const existing = await userRef.get();
        const background = validHttpUrl($("lobby-bg-url").value);

        if (existing.exists) {
          const updates = {
            email: user.email || "",
            photoURL: user.photoURL || "",
            status: "online",
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
          };
          if (background) updates.customBackground = background;
          await userRef.update(updates);
        } else {
          const base = (user.displayName || "user")
            .toLowerCase().replace(/[^a-z0-9_]/g, "_")
            .replace(/^_+|_+$/g, "").slice(0, 24) || "user";

          let done = false;
          for (let i = 0; i < 20 && !done; i++) {
            const candidate = i === 0 ? base : `${base}_${1000 + Math.floor(Math.random() * 9000)}`;
            try {
              await reserveUsername(user, candidate, background);
              done = true;
            } catch (error) {
              if (error.message !== "That username is already taken.") throw error;
            }
          }
          if (!done) throw new Error("Could not find an available username. Please try again.");
        }

        window.location.href = "chat.html";
      } catch (error) {
        console.error(error);
        showError(authError(error));
      } finally {
        setBusy(false);
      }
    }

    $("action-btn").addEventListener("click", handleAuth);
    $("google-btn").addEventListener("click", loginWithGoogle);
    document.addEventListener("keydown", event => {
      if (event.key === "Enter" && !busy) handleAuth();
    });

    updateMode();
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = "chat.html";
    });
  </script>
</body>
</html>
